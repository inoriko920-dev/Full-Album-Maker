name: STEP04 Album validation

on:
  push:
    branches:
      - ui/step-04-album
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-album:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout STEP04 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Stage pinned Noto Sans visual-QA font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf" \
            --output assets/fonts/NotoSans.ttf
          test $(stat -c%s assets/fonts/NotoSans.ttf) -gt 1000000
      - name: Compile source
        run: python -m compileall -q src
      - name: Run STEP04 focused and acceptance tests
        run: |
          python -m pytest -q \
            tests/test_step04_album_model.py \
            tests/test_step04_album_ui.py \
            tests/test_step04_album_integration.py \
            tests/test_step04_album_acceptance.py
      - name: Run STEP03 regressions
        run: |
          python -m pytest -q \
            tests/test_step03_media_model.py \
            tests/test_step03_media_services.py \
            tests/test_step03_media_ui.py \
            tests/test_step03_completion.py \
            tests/test_step03_preview_cache_final.py
      - name: Run recovered media regressions
        run: python -m pytest -q tests/test_async_import.py tests/test_ui_media_regressions.py
      - name: Run full recovered regression suite
        run: python -m pytest -q --disable-warnings
      - name: Capture deterministic STEP04 Album evidence
        run: |
          mkdir -p step04-album-evidence/current step04-album-evidence/reports step04-album-evidence/compare
          python -m full_album_maker.album_capture \
            --state golden \
            --output step04-album-evidence/current/album-g04-final.png \
            --report step04-album-evidence/reports/album-g04-final.json
          python -m full_album_maker.album_capture \
            --state empty \
            --output step04-album-evidence/current/album-empty-final.png \
            --report step04-album-evidence/reports/album-empty-final.json
          python -m full_album_maker.album_capture \
            --state golden --width 1366 --height 768 \
            --output step04-album-evidence/current/album-1366-final.png \
            --report step04-album-evidence/reports/album-1366-final.json
      - name: Validate Album geometry and fixture contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def geometry(name):
              return json.loads(Path(f'step04-album-evidence/reports/{name}.json').read_text())['geometry']

          main = geometry('album-g04-final')
          assert main['window'] == [1672, 941], main
          assert main['workspace'] == 'album' and main['album_active'] is True, main
          assert main['context_visible'] is True and main['inspector_active'] is True, main
          assert main['timeline_visible'] is True, main
          assert main['context_width'] in range(254, 275), main
          assert main['right_dock_width'] in range(338, 359), main
          assert main['timeline_height'] in range(184, 205), main
          assert main['status_height'] in range(26, 31), main
          assert main['table_rows'] == 10, main
          assert main['song_count'] == 100, main
          assert main['missing_cover'] == 12, main
          assert main['missing_visual'] == 18, main
          assert main['needs_review'] == 6, main
          assert main['album_duration'] == '2j 47m', main
          assert main['selected_count'] == 12, main
          assert main['bulk_heading'] == 'Alat Massal (12 lagu dipilih)', main
          assert main['page_label'] == 'Halaman 1 dari 10', main

          empty = geometry('album-empty-final')
          assert empty['song_count'] == 0 and empty['selected_count'] == 0, empty
          assert empty['table_rows'] == 0, empty

          compact = geometry('album-1366-final')
          assert compact['window'] == [1366, 768] and compact['album_active'] is True, compact
          assert compact['table_rows'] == 10 and compact['selected_count'] == 12, compact
          assert compact['right_dock_width'] in range(290, 311), compact
          print('STEP04_ALBUM_GEOMETRY_PASS')
          PY
      - name: Verify immutable Album golden and build overlay when available
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image, ImageChops

          expected = '42756121fc9a0b18b03d006710d1fb528388b3cf86eaf25c0e72afdac11062b9'
          ref = Path('docs/ui-reference/03-album.png')
          current = Path('step04-album-evidence/current/album-g04-final.png')
          report = {
              'reference': '03-album.png',
              'expected_sha256': expected,
              'status': 'LOCAL_PENDING',
          }
          if ref.is_file():
              actual = hashlib.sha256(ref.read_bytes()).hexdigest()
              assert actual == expected, (actual, expected)
              golden = Image.open(ref).convert('RGB')
              rendered = Image.open(current).convert('RGB')
              assert golden.size == rendered.size == (1672, 941), (golden.size, rendered.size)
              Image.blend(golden, rendered, 0.5).save('step04-album-evidence/compare/album-overlay-50.png')
              ImageChops.difference(golden, rendered).save('step04-album-evidence/compare/album-diff.png')
              report['actual_sha256'] = actual
              report['status'] = 'PASS'
          else:
              report['detail'] = 'Exact UI-03 binary is intentionally external; provide the immutable local golden pack for pixel overlay.'
          Path('step04-album-evidence/reports/golden-reference-status.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print('STEP04_GOLDEN_REFERENCE_' + report['status'])
          PY
      - name: Secret scan STEP04 surfaces
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),
              re.compile(r'AIza[0-9A-Za-z_-]{35}'),
              re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          ]
          hits=[]
          for root in (Path('src/full_album_maker'), Path('tests')):
              for path in root.rglob('*.py'):
                  text=path.read_text(encoding='utf-8', errors='ignore')
                  if any(pattern.search(text) for pattern in patterns):
                      hits.append(str(path))
          assert not hits, hits
          print('STEP04_ALBUM_SECRET_SCAN_PASS')
          PY
      - name: Upload STEP04 Album evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step04-album-evidence
          path: step04-album-evidence/
          if-no-files-found: error
