name: STEP06 Visual validation

on:
  push:
    branches:
      - ui/step-06-visual
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-visual:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout STEP06 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          # Keep the full-regression environment aligned with STEP05.
          # STEP06 contract tests compile FFmpeg graphs but do not execute FFmpeg.
          # Installing Ubuntu's system FFmpeg here would activate legacy tests
          # intended for the pinned Windows FFmpeg build and create false failures.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Stage pinned Noto Sans visual-QA font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf" \
            --output assets/fonts/NotoSans.ttf
          test $(stat -c%s assets/fonts/NotoSans.ttf) -gt 1000000
      - name: Compile source
        run: python -m compileall -q src
      - name: Run STEP06 focused Visual tests
        run: |
          python -m pytest -q \
            tests/test_step06_visual_precision.py \
            tests/test_step06_visual_assignment.py \
            tests/test_step06_visual_preview_decode.py \
            tests/test_step06_visual_ui.py
      - name: Run recovered v1.3 Visual regression
        run: python -m pytest -q tests/test_editor_v2_v13_song_visuals.py
      - name: Run STEP05 Timeline regression gate
        run: |
          python -m pytest -q \
            tests/test_step05_timeline_precision.py \
            tests/test_step05_timeline_audio.py \
            tests/test_step05_timeline_ui.py \
            tests/test_step05_timeline_integration.py \
            tests/test_step05_timeline_render_mix.py \
            tests/test_step05_timeline_completion.py
      - name: Run full recovered regression suite
        timeout-minutes: 5
        run: python -m pytest -q --disable-warnings
      - name: Capture deterministic STEP06 Visual evidence
        run: |
          mkdir -p step06-visual-evidence/current step06-visual-evidence/reports step06-visual-evidence/compare
          python -m full_album_maker.visual_capture_step06 \
            --output step06-visual-evidence/current/visual-g05-final.png \
            --report step06-visual-evidence/reports/visual-g05-final.json
          python -m full_album_maker.visual_capture_step06 \
            --width 1366 --height 768 \
            --output step06-visual-evidence/current/visual-1366-final.png \
            --report step06-visual-evidence/reports/visual-1366-final.json
      - name: Validate STEP06 Visual geometry and fixture contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def geometry(name):
              return json.loads(Path(f'step06-visual-evidence/reports/{name}.json').read_text(encoding='utf-8'))['geometry']

          main = geometry('visual-g05-final')
          assert main['window'] == [1672, 941], main
          assert main['workspace'] == 'visual' and main['visual_active'] is True, main
          assert main['context_visible'] is True and main['inspector_active'] is True, main
          assert main['timeline_visible'] is True, main
          assert main['context_width'] in range(254, 275), main
          assert main['right_dock_width'] in range(338, 359), main
          assert main['timeline_height'] in range(228, 249), main
          assert main['status_height'] in range(26, 31), main
          assert main['song_rows'] == 6 and main['song_count'] == 6, main
          assert main['selected_count'] == 1, main
          assert main['primary_song'] == 'Senja di Kota Ini', main
          assert main['primary_state'] == 'image', main
          assert main['counts'] == {'all': 6, 'empty': 1, 'image': 2, 'video': 2, 'missing': 1}, main
          assert main['fit'] == 'fill' and main['motion'] == 'ken_burns', main
          assert main['transition'] == 'fade' and abs(main['transition_seconds'] - 1.2) < 1e-9, main
          assert main['apply_label'] == 'Apply to Selected (1)', main
          assert 'Foto' in main['source_label'] and 'visual-foto-1.png' in main['source_label'], main
          assert main['content_unchanged_by_route'] is True, main

          compact = geometry('visual-1366-final')
          assert compact['window'] == [1366, 768], compact
          assert compact['workspace'] == 'visual' and compact['visual_active'] is True, compact
          assert compact['context_visible'] is True and compact['inspector_active'] is True, compact
          assert compact['timeline_visible'] is True, compact
          assert compact['song_rows'] == 6 and compact['selected_count'] == 1, compact
          assert compact['right_dock_width'] in range(290, 311), compact
          assert compact['content_unchanged_by_route'] is True, compact
          print('STEP06_VISUAL_GEOMETRY_PASS')
          PY
      - name: Verify immutable Visual golden and build overlay when available
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image, ImageChops

          expected = '8b661752b235de74843950945126ab80837dec01953b796fcdcd6ad2ac317ef8'
          ref = Path('docs/ui-reference/05-visual.png')
          current = Path('step06-visual-evidence/current/visual-g05-final.png')
          report = {
              'reference': '05-visual.png',
              'expected_sha256': expected,
              'status': 'LOCAL_PENDING',
          }
          if ref.is_file():
              actual = hashlib.sha256(ref.read_bytes()).hexdigest()
              assert actual == expected, (actual, expected)
              golden = Image.open(ref).convert('RGB')
              rendered = Image.open(current).convert('RGB')
              assert golden.size == rendered.size == (1672, 941), (golden.size, rendered.size)
              Image.blend(golden, rendered, 0.5).save('step06-visual-evidence/compare/visual-overlay-50.png')
              ImageChops.difference(golden, rendered).save('step06-visual-evidence/compare/visual-diff.png')
              report['actual_sha256'] = actual
              report['status'] = 'PASS'
          else:
              report['detail'] = 'Exact UI-05 binary is not stored in this branch; provide the immutable local golden pack for exact overlay/diff.'
          Path('step06-visual-evidence/reports/golden-reference-status.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print('STEP06_GOLDEN_REFERENCE_' + report['status'])
          PY
      - name: Secret scan STEP06 surfaces
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),
              re.compile(r'AIza[0-9A-Za-z_-]{35}'),
              re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          ]
          hits=[]
          for root in (Path('src/full_album_maker'), Path('tests')):
              for path in root.rglob('*.py'):
                  text=path.read_text(encoding='utf-8', errors='ignore')
                  if any(pattern.search(text) for pattern in patterns):
                      hits.append(str(path))
          assert not hits, hits
          print('STEP06_VISUAL_SECRET_SCAN_PASS')
          PY
      - name: Upload STEP06 Visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step06-visual-evidence
          path: step06-visual-evidence/
          if-no-files-found: error
