name: STEP09 AI Agent validation

on:
  push:
    branches:
      - ui/step-09-ai-agent
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ai:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
      FAM_STEP09_PROVIDER: mock
    steps:
      - name: Checkout STEP09 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run STEP09 focused core/provider/workspace tests
        run: |
          python -m pytest -q \
            tests/test_step09_slowmo_contract.py \
            tests/test_step09_agent_core.py \
            tests/test_step09_provider.py \
            tests/test_step09_async_provider.py \
            tests/test_step09_history_store.py \
            tests/test_step09_session_flow.py \
            tests/test_step09_workspace_ui.py
      - name: Run recovered AI atomic regression
        run: |
          python -m pytest -q \
            tests/test_editor_v2_s09_ai_editor.py \
            tests/test_editor_v2_v14_action_registry.py \
            tests/test_editor_v2_v14_ai_parity.py
      - name: Run provider and key-pool regression
        run: |
          python -m pytest -q \
            tests/test_gemini_intents.py \
            tests/test_gemini_schema_compat.py \
            tests/test_key_pool.py \
            tests/test_key_pool_hardening.py \
            tests/test_key_pool_retries.py
      - name: Run STEP08 Spectrum regression gate
        run: |
          python -m pytest -q \
            tests/test_step08_spectrum_model.py \
            tests/test_step08_spectrum_render.py \
            tests/test_step08_spectrum_persistence.py \
            tests/test_step08_spectrum_ui.py
      - name: Run full recovered regression suite
        timeout-minutes: 6
        run: python -m pytest -q --disable-warnings

      - name: Capture deterministic STEP09 AI Agent evidence
        run: |
          mkdir -p step09-ai-evidence/current step09-ai-evidence/reports step09-ai-evidence/compare
          python -m full_album_maker.ai_capture_step09 \
            --output step09-ai-evidence/current/ai-agent-g08-final.png \
            --report step09-ai-evidence/reports/ai-agent-g08-final.json
          python -m full_album_maker.ai_capture_step09 \
            --width 1366 --height 768 \
            --output step09-ai-evidence/current/ai-agent-1366-final.png \
            --report step09-ai-evidence/reports/ai-agent-1366-final.json
      - name: Validate STEP09 golden state and geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def geometry(name):
              return json.loads(Path(f'step09-ai-evidence/reports/{name}.json').read_text(encoding='utf-8'))['geometry']

          main = geometry('ai-agent-g08-final')
          assert main['window'] == [1672, 941], main
          assert main['workspace'] == 'ai_agent' and main['ai_active'] is True, main
          assert main['conversation_visible'] is True and main['context_dock_active'] is True, main
          assert main['timeline_visible'] is True, main
          assert main['context_width'] in range(254, 275), main
          assert main['right_dock_width'] in range(338, 359), main
          assert main['timeline_height'] in range(168, 189), main
          assert main['status_height'] in range(26, 31), main
          assert main['state'] == 'PREVIEW_READY', main
          assert main['provider'] == 'mock', main
          assert main['scope_song_count'] == 20, main
          assert main['visual_action_count'] == 20, main
          assert main['plan_action_count'] == 22, main
          assert abs(main['slowmo_speed'] - 0.5) < 1e-9, main
          assert main['auto_arrange_present'] is True, main
          assert main['preview_command_count'] >= 22, main
          assert main['preview_change_count'] > 0, main
          assert main['project_signature_unchanged_by_send_and_preview'] is True, main
          assert main['project_revision_unchanged_by_send_and_preview'] is True, main
          assert main['send_and_preview_did_not_apply_visual'] is True, main
          assert main['send_and_preview_did_not_apply_slowmo'] is True, main

          compact = geometry('ai-agent-1366-final')
          assert compact['window'] == [1366, 768], compact
          assert compact['workspace'] == 'ai_agent' and compact['ai_active'] is True, compact
          assert compact['conversation_visible'] is True and compact['context_dock_active'] is True, compact
          assert compact['timeline_visible'] is True, compact
          assert compact['right_dock_width'] in range(290, 311), compact
          assert compact['state'] == 'PREVIEW_READY', compact
          assert compact['scope_song_count'] == 20, compact
          assert compact['visual_action_count'] == 20, compact
          assert compact['project_signature_unchanged_by_send_and_preview'] is True, compact
          assert compact['project_revision_unchanged_by_send_and_preview'] is True, compact
          print('STEP09_AI_GOLDEN_GEOMETRY_PASS')
          PY
      - name: Verify immutable AI Agent golden and build overlay when available
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image, ImageChops

          expected = '276a602d2617762e87b2007e7191f9042217b41dd3bf75ce42da7a5fa5be29f3'
          ref = Path('docs/ui-reference/08-ai-agent.png')
          current = Path('step09-ai-evidence/current/ai-agent-g08-final.png')
          report = {
              'reference': '08-ai-agent.png',
              'expected_sha256': expected,
              'status': 'LOCAL_PENDING',
          }
          if ref.is_file():
              actual = hashlib.sha256(ref.read_bytes()).hexdigest()
              assert actual == expected, (actual, expected)
              golden = Image.open(ref).convert('RGB')
              rendered = Image.open(current).convert('RGB')
              assert golden.size == rendered.size == (1672, 941), (golden.size, rendered.size)
              Image.blend(golden, rendered, 0.5).save('step09-ai-evidence/compare/ai-agent-overlay-50.png')
              ImageChops.difference(golden, rendered).save('step09-ai-evidence/compare/ai-agent-diff.png')
              report['actual_sha256'] = actual
              report['status'] = 'PASS'
          else:
              report['detail'] = 'Exact UI-08 binary is external to this branch; exact overlay remains LOCAL_PENDING.'
          Path('step09-ai-evidence/reports/golden-reference-status.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print('STEP09_GOLDEN_REFERENCE_' + report['status'])
          PY
      - name: Secret scan STEP09 AI surfaces and evidence
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),
              re.compile(r'AIza[0-9A-Za-z_-]{35}'),
              re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          ]
          roots = [Path('src/full_album_maker'), Path('tests'), Path('docs/ui-ai-agent'), Path('step09-ai-evidence')]
          hits=[]
          for root in roots:
              if not root.exists():
                  continue
              paths = [root] if root.is_file() else root.rglob('*')
              for path in paths:
                  if not path.is_file() or path.suffix.lower() not in {'.py', '.md', '.json', '.txt', '.yml', '.yaml'}:
                      continue
                  text=path.read_text(encoding='utf-8', errors='ignore')
                  if any(pattern.search(text) for pattern in patterns):
                      hits.append(str(path))
          assert not hits, hits
          print('STEP09_AI_SECRET_SCAN_PASS')
          PY
      - name: Upload STEP09 AI Agent evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step09-ai-evidence
          path: step09-ai-evidence/
          if-no-files-found: error
