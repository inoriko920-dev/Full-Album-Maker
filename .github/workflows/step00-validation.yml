# STEP00 recovery validation — final baseline candidate
name: STEP00 validation gate

on:
  push:
    branches:
      - recovery/step-00-r0
    paths:
      - .github/workflows/step00-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install recovered project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Compile recovered source
        run: python -m compileall -q src

      - name: Import core application boundary
        run: |
          python - <<'PY'
          import full_album_maker
          import full_album_maker.main
          import full_album_maker.project
          import full_album_maker.project_io
          import full_album_maker.timeline
          import full_album_maker.controller
          import full_album_maker.renderer
          import full_album_maker.paths
          print('CORE_IMPORT_PASS')
          PY

      - name: Compare exact v1.4.0 source modules with portable v1.4.1 build names
        run: |
          python - <<'PY'
          from pathlib import Path
          prefix='full_album_maker.'
          src={prefix+p.stem for p in Path('src/full_album_maker').glob('*.py') if p.name != '__init__.py'}
          lines=Path('docs/recovery/PORTABLE_V1_4_1_MODULES.txt').read_text(encoding='utf-8').splitlines()
          portable={x.strip() for x in lines if x.startswith(prefix)}
          missing=sorted(portable-src)
          source_only=sorted(src-portable)
          print(f'SOURCE_MODULES={len(src)}')
          print(f'PORTABLE_MODULE_NAMES={len(portable)}')
          print(f'PORTABLE_WITHOUT_EXACT_V140_SOURCE={len(missing)}')
          for x in missing: print('BUILD_ONLY_NAME', x)
          print(f'SOURCE_ONLY_V140={len(source_only)}')
          for x in source_only: print('SOURCE_ONLY', x)
          PY

      - name: High-confidence secret scan
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns = {
              'PRIVATE_KEY': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'GITHUB_TOKEN': re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),
              'GOOGLE_API_KEY': re.compile(r'AIza[0-9A-Za-z_-]{35}'),
              'AWS_ACCESS_KEY': re.compile(r'AKIA[0-9A-Z]{16}'),
              'OPENAI_LIKE_KEY': re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          }
          roots=[Path('src'),Path('tests'),Path('build'),Path('assets'),Path('docs'),Path('.github')]
          hits=[]
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  try: text=p.read_text(encoding='utf-8')
                  except Exception: continue
                  for lineno,line in enumerate(text.splitlines(),1):
                      for kind,rx in patterns.items():
                          if rx.search(line): hits.append((str(p),lineno,kind))
          if hits:
              for path,line,kind in hits:
                  print(f'SECRET_CANDIDATE {kind} {path}:{line}')
              raise SystemExit(f'high-confidence secret candidates: {len(hits)}')
          print('SECRET_SCAN_PASS')
          PY

      - name: Run recovered test suite
        run: python -m pytest -q --disable-warnings
