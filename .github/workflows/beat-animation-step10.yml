name: STEP10 Advanced Beat Catalog and BPM Sync

on:
  push:
    branches:
      - feature/beat-animation-engine-v2
    paths:
      - "src/full_album_maker/beat_preset_catalog.py"
      - "src/full_album_maker/music_style_presets.py"
      - "src/full_album_maker/vinyl_bpm_sync.py"
      - "src/full_album_maker/visual_binding_contract.py"
      - "src/full_album_maker/visual_binding_engine.py"
      - "src/full_album_maker/beat_layer_capabilities.py"
      - "src/full_album_maker/beat_animation_assignment.py"
      - "src/full_album_maker/beat_visual_runtime.py"
      - "src/full_album_maker/preview_scene.py"
      - "src/full_album_maker/render_graph.py"
      - "src/full_album_maker/album_visuals.py"
      - "src/full_album_maker/property_inspector.py"
      - "src/full_album_maker/editor_session.py"
      - "src/full_album_maker/editor_workspace.py"
      - "tests/test_step10_advanced_catalog.py"
      - "tests/test_step10_music_styles.py"
      - "tests/test_step10_vinyl_bpm_sync.py"
      - "tests/test_step10_real_ffmpeg.py"
      - "tests/test_step07_visual_bindings.py"
      - ".github/workflows/beat-animation-step10.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/beat-animation-engine-v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
          python -m pip install --disable-pip-version-check -r build/requirements-audio-analysis-step04.lock
          python -m pip install --disable-pip-version-check -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: STEP10 advanced catalog tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step10_advanced_catalog.py
      - name: STEP10 music style tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step10_music_styles.py
      - name: STEP10 vinyl BPM sync tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step10_vinyl_bpm_sync.py
      - name: STEP09 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step09_beat_expansion.py
      - name: STEP08 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step08_beat_integration.py tests/test_step08_beat_preview.py
      - name: STEP07 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step07_visual_bindings.py
      - name: STEP06 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step06_animation_signals.py
      - name: STEP05 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step05_music_events.py
      - name: STEP04 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step04_audio_analysis.py
      - name: Import smoke
        env:
          PYTHONPATH: src
        run: python -c "from full_album_maker.beat_preset_catalog import BEAT_PRESET_CATALOG; from full_album_maker.music_style_presets import MUSIC_STYLE_CATALOG; from full_album_maker.vinyl_bpm_sync import synced_spin_seconds; assert len(BEAT_PRESET_CATALOG)==18; assert len(MUSIC_STYLE_CATALOG)==9; print('STEP10_IMPORT_OK')"

  real-ffmpeg:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/beat-animation-engine-v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
          python -m pip install --disable-pip-version-check -r build/requirements-audio-analysis-step04.lock
          python -m pip install --disable-pip-version-check -e .
      - name: STEP10 real FFmpeg smoke
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step10_real_ffmpeg.py
      - name: STEP09 real FFmpeg regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step09_beat_real_ffmpeg.py
      - name: STEP08 real FFmpeg regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step08_beat_real_ffmpeg.py
