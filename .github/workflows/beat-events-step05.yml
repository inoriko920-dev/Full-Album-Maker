name: STEP05 Music Event Engine

on:
  push:
    branches:
      - feature/beat-animation-engine-v2
    paths:
      - "src/full_album_maker/music_event_*.py"
      - "tests/test_step05_music_events.py"
      - ".github/workflows/beat-events-step05.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/beat-animation-engine-v2
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"

      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
          python -m pip install --disable-pip-version-check -r build/requirements-audio-analysis-step04.lock

      - name: Run STEP05 focused suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step05_music_events.py

      - name: Run STEP04 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step04_audio_analysis.py
