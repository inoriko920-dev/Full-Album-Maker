name: STEP15 Windows Portable Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/beat-animation-engine-v2
    paths:
      - "src/full_album_maker/__init__.py"
      - "src/full_album_maker/main.py"
      - "src/full_album_maker/release_beat_export_smoke.py"
      - "pyproject.toml"
      - "build/requirements-windows.lock"
      - "build/write_release_capabilities.py"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/RELEASE_NOTES_v1.6.0.md"
      - ".github/workflows/build-windows-portable.yml"
      - ".github/workflows/beat-animation-step15-release-candidate.yml"

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: windows-2025
    env:
      EXPECTED_VERSION: "1.6.0"
      EXPECTED_MAIN_SHA: "584c94774e6197ecf60ecedb3bffd5a8797e7737"
      RC_LABEL: "RC1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/beat-animation-engine-v2
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"

      - name: Verify stable main and release identity
        shell: pwsh
        run: |
          $mainLine = git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0 -or -not $mainLine) { throw "Tidak dapat membaca refs/heads/main." }
          $mainSha = ($mainLine -split "\s+")[0].Trim()
          if ($mainSha -ne $env:EXPECTED_MAIN_SHA) {
            throw "Stable main berubah. Expected $env:EXPECTED_MAIN_SHA, got $mainSha"
          }

          $initVersion = python -c "import sys; sys.path.insert(0, 'src'); import full_album_maker; print(full_album_maker.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Tidak dapat membaca __version__." }
          $initVersion = $initVersion.Trim()

          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Tidak dapat membaca pyproject version." }
          $projectVersion = $projectVersion.Trim()

          if ($initVersion -ne $env:EXPECTED_VERSION -or $projectVersion -ne $env:EXPECTED_VERSION) {
            throw "Version mismatch. __version__=$initVersion pyproject=$projectVersion expected=$env:EXPECTED_VERSION"
          }

          $notes = "docs/RELEASE_NOTES_v$env:EXPECTED_VERSION.md"
          if (-not (Test-Path $notes)) { throw "Release notes tidak ditemukan: $notes" }

          "APP_VERSION=$initVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_ZIP=Full-Album-Maker-v$initVersion-$env:RC_LABEL-Windows-Portable.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_ARTIFACT=Full-Album-Maker-v$initVersion-$env:RC_LABEL-Windows-Portable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install exact Windows runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r build/requirements-windows.lock
          python -m pip check
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Download pinned FFmpeg and Noto Sans
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-03-18-14/ffmpeg-N-127142-g12b7b9891b-win64-gpl.zip"
          $ffmpegSha256 = "a885f564dee2b60f69ab866c6c89b96ae531fc2ee1f24ff8b5b1a6d29960a96b"
          Invoke-WebRequest -Uri $ffmpegUrl -Headers @{"User-Agent"="Full-Album-Maker-RC"} -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $ffmpegSha256) { throw "FFmpeg SHA mismatch: $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_unpack

          $ffmpeg = Get-ChildItem ffmpeg_unpack -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg_unpack -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "ffmpeg.exe/ffprobe.exe tidak ditemukan." }

          New-Item -ItemType Directory -Force "tools\ffmpeg" | Out-Null
          Copy-Item $ffmpeg.FullName "tools\ffmpeg\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "tools\ffmpeg\ffprobe.exe"
          (Resolve-Path "tools\ffmpeg").Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $encoders = & "tools\ffmpeg\ffmpeg.exe" -hide_banner -encoders 2>&1 | Out-String
          if ($encoders -notmatch "libx264" -or $encoders -notmatch "libx265") {
            throw "Pinned FFmpeg tidak memiliki libx264/libx265."
          }

          $fontCommit = "23e54b51ddffbc7713c583748e3bd86f62b1fa4a"
          New-Item -ItemType Directory -Force "assets\fonts" | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$fontCommit/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf" -OutFile "assets\fonts\NotoSans.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$fontCommit/ofl/notosans/OFL.txt" -OutFile "assets\fonts\NotoSans-OFL.txt"
          if ((Get-Item "assets\fonts\NotoSans.ttf").Length -lt 1000000) { throw "Noto Sans tidak lengkap." }

      - name: Full compile and regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ffmpeg -version
          ffprobe -version
          python -m compileall -q src
          python -m pytest -q

      - name: Prepare icon and build clean onedir EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python build/generate_icon.py
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "Full Album Maker" --icon "$PWD\assets\logo.ico" --paths "$PWD\src" "$PWD\src\full_album_maker\main.py"
          if (-not (Test-Path "dist\Full Album Maker\Full Album Maker.exe")) { throw "PyInstaller EXE tidak ditemukan." }

      - name: Bundle portable runtime and capability evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist\Full Album Maker\tools\ffmpeg" | Out-Null
          Copy-Item "tools\ffmpeg\ffmpeg.exe" "dist\Full Album Maker\tools\ffmpeg\ffmpeg.exe"
          Copy-Item "tools\ffmpeg\ffprobe.exe" "dist\Full Album Maker\tools\ffmpeg\ffprobe.exe"
          Copy-Item LICENSE "dist\Full Album Maker\LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "dist\Full Album Maker\THIRD_PARTY_NOTICES.md"

          New-Item -ItemType Directory -Force "dist\Full Album Maker\assets\fonts" | Out-Null
          Copy-Item "assets\logo.svg" "dist\Full Album Maker\assets\logo.svg"
          Copy-Item "assets\fonts\fonts.conf" "dist\Full Album Maker\assets\fonts\fonts.conf"
          Copy-Item "assets\fonts\NotoSans.ttf" "dist\Full Album Maker\assets\fonts\NotoSans.ttf"
          Copy-Item "assets\fonts\NotoSans-OFL.txt" "dist\Full Album Maker\assets\fonts\NotoSans-OFL.txt"

          $ffLicense = Get-ChildItem ffmpeg_unpack -Recurse -File | Where-Object { $_.Name -eq "LICENSE.txt" } | Select-Object -First 1
          $ffReadme = Get-ChildItem ffmpeg_unpack -Recurse -File | Where-Object { $_.Name -eq "README.txt" } | Select-Object -First 1
          if ($ffLicense) { Copy-Item $ffLicense.FullName "dist\Full Album Maker\FFMPEG-LICENSE.txt" }
          if ($ffReadme) { Copy-Item $ffReadme.FullName "dist\Full Album Maker\FFMPEG-README.txt" }

          New-Item -ItemType Directory -Force "dist\Full Album Maker\data" | Out-Null
          New-Item -ItemType Directory -Force "dist\Full Album Maker\temp" | Out-Null
          New-Item -ItemType Directory -Force "dist\Full Album Maker\output" | Out-Null
          python build/write_release_capabilities.py --root "dist\Full Album Maker"

          $cap = Get-Content "dist\Full Album Maker\CAPABILITIES.json" -Raw | ConvertFrom-Json
          if ($cap.app_version -ne $env:APP_VERSION) { throw "CAPABILITIES app version mismatch." }
          if (-not $cap.features.beat_animation_v2) { throw "CAPABILITIES belum mencatat Beat Animation V2." }
          if (-not $cap.features.scientific_runtime_bundled) { throw "CAPABILITIES belum mencatat scientific runtime." }

      - name: Create RC ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Full Album Maker" -DestinationPath $env:RC_ZIP
          if (-not (Test-Path $env:RC_ZIP)) { throw "RC ZIP tidak dibuat." }
          $zipSha = (Get-FileHash $env:RC_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipSha  $env:RC_ZIP" | Set-Content "SHA256SUMS-RC1.txt" -Encoding ascii
          $recorded = (Get-Content "SHA256SUMS-RC1.txt" -Raw).Trim()
          if ($recorded -ne "$zipSha  $env:RC_ZIP") { throw "RC checksum file mismatch." }

      - name: Isolated extracted ZIP smoke including Beat V2 export
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $extractRoot = Join-Path $PWD "RC smoke – O'Brien"
          Expand-Archive $env:RC_ZIP -DestinationPath $extractRoot
          $app = Get-ChildItem $extractRoot -Recurse -Filter "Full Album Maker.exe" | Select-Object -First 1
          if (-not $app) { throw "Extracted RC EXE tidak ditemukan." }

          $oldPath = $env:PATH
          try {
            $env:GEMINI_API_KEY = $null
            $env:GOOGLE_API_KEY = $null
            $env:PYTHONHOME = $null
            $env:PYTHONPATH = $null
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

            if (Get-Command python -ErrorAction SilentlyContinue) { throw "Global Python masih terlihat." }
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { throw "Global FFmpeg masih terlihat." }

            foreach ($flag in @("--portable-smoke","--beat-runtime-smoke","--beat-export-smoke")) {
              $proc = Start-Process -FilePath $app.FullName -ArgumentList $flag -Wait -PassThru
              if ($proc.ExitCode -ne 0) { throw "$flag gagal dengan exit code $($proc.ExitCode)." }
            }
          }
          finally {
            $env:PATH = $oldPath
          }

          $portableReport = Join-Path $app.DirectoryName "temp\portable-smoke.json"
          $beatReport = Join-Path $app.DirectoryName "temp\beat-export-smoke.json"
          if (-not (Test-Path $portableReport)) { throw "portable-smoke.json hilang." }
          if (-not (Test-Path $beatReport)) { throw "beat-export-smoke.json hilang." }

          $portable = Get-Content $portableReport -Raw | ConvertFrom-Json
          $beat = Get-Content $beatReport -Raw | ConvertFrom-Json
          if (-not $portable.ok -or $portable.api_key_present) { throw "Portable smoke offline contract gagal." }
          if ($portable.output_streams -notcontains "audio" -or $portable.output_streams -notcontains "video") { throw "Portable smoke A/V gagal." }
          if ($portable.gui_title -notlike "*v$env:APP_VERSION*") { throw "GUI title tidak menampilkan v$env:APP_VERSION." }

          if (-not $beat.ok -or $beat.api_key_present) { throw "Beat V2 export smoke gagal." }
          if ($beat.output_streams -notcontains "audio" -or $beat.output_streams -notcontains "video") { throw "Beat V2 export A/V gagal." }
          if ($beat.trigger_count -le 0 -or $beat.event_count -le 0) { throw "Beat V2 smoke tidak menghasilkan event/trigger." }
          if ($beat.cover_scale_at_beat -le 1.0) { throw "Cover Beat pulse tidak aktif." }
          if ($beat.spectrum_glow_at_onset -le 0) { throw "Spectrum Beat modulation tidak aktif." }
          if ($beat.vinyl_synced_spin_seconds -ge 8.0) { throw "Vinyl BPM Sync tidak aktif." }

          Copy-Item $portableReport "portable-smoke-RC1.json"
          Copy-Item $beatReport "beat-export-smoke-RC1.json"

      - name: Create and verify RC provenance manifest
        shell: pwsh
        run: |
          $zipSha = (Get-FileHash $env:RC_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipBytes = (Get-Item $env:RC_ZIP).Length
          $mainLine = git ls-remote origin refs/heads/main
          $mainSha = ($mainLine -split "\s+")[0].Trim()
          if ($mainSha -ne $env:EXPECTED_MAIN_SHA) { throw "main berubah selama RC gate." }

          $manifest = [ordered]@{
            format = "full-album-maker-release-candidate"
            release_candidate = "v$env:APP_VERSION $env:RC_LABEL"
            source_commit = $env:GITHUB_SHA
            stable_main_sha = $mainSha
            app_version = $env:APP_VERSION
            build_platform = "windows-2025 x86_64 PyInstaller onedir"
            python_version = "3.12.10"
            pip_version = "26.2.1"
            ffmpeg = [ordered]@{
              tag = "autobuild-2026-10-03-18-14"
              version_family = "master N-127142-g12b7b9891b"
              sha256 = "a885f564dee2b60f69ab866c6c89b96ae531fc2ee1f24ff8b5b1a6d29960a96b"
            }
            zip_name = $env:RC_ZIP
            zip_sha256 = $zipSha
            zip_bytes = $zipBytes
            smoke_results = [ordered]@{
              portable = $true
              frozen_beat_runtime = $true
              beat_v2_export = $true
              isolated_no_global_python = $true
              isolated_no_global_ffmpeg = $true
              no_api_key = $true
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content "RC_MANIFEST.json" -Encoding utf8

          $check = Get-Content "RC_MANIFEST.json" -Raw | ConvertFrom-Json
          if ($check.source_commit -ne $env:GITHUB_SHA) { throw "Manifest source SHA mismatch." }
          if ($check.zip_sha256 -ne $zipSha) { throw "Manifest ZIP checksum mismatch." }
          if ($check.stable_main_sha -ne $env:EXPECTED_MAIN_SHA) { throw "Manifest main SHA mismatch." }

          $sum = (Get-Content "SHA256SUMS-RC1.txt" -Raw).Trim()
          if ($sum -ne "$zipSha  $env:RC_ZIP") { throw "Final checksum verification gagal." }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.RC_ARTIFACT }}
          path: |
            ${{ env.RC_ZIP }}
            SHA256SUMS-RC1.txt
            RC_MANIFEST.json
            portable-smoke-RC1.json
            beat-export-smoke-RC1.json
            docs/RELEASE_NOTES_v1.6.0.md
          if-no-files-found: error
          retention-days: 30

      - name: Final STEP15 GO evidence
        shell: pwsh
        run: |
          Write-Host "STEP15_GO"
          Write-Host "Source: $env:GITHUB_SHA"
          Write-Host "Stable main: $env:EXPECTED_MAIN_SHA"
          Write-Host "Artifact: $env:RC_ARTIFACT"
          Get-Content SHA256SUMS-RC1.txt
