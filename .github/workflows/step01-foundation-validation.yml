name: STEP01 Foundation UI validation

on:
  push:
    branches:
      - ui/step-01-foundation
    paths-ignore:
      - docs/ui-foundation/STEP01_TEST_REPORT.md
      - docs/ui-foundation/HANDOFF_STEP01.md
      - docs/ui-foundation/BASELINE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout STEP01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Stage pinned Noto Sans visual-QA font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf" \
            --output assets/fonts/NotoSans.ttf
          test $(stat -c%s assets/fonts/NotoSans.ttf) -gt 1000000

      - name: Verify frozen golden manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('docs/ui-reference/manifest.json').read_text(encoding='utf-8'))
          assert manifest['golden_viewport'] == [1672, 941]
          assert len(manifest['references']) == 9
          assert len({item['sha256'] for item in manifest['references']}) == 9
          print('GOLDEN_MANIFEST_PASS')
          PY

      - name: Compile source
        run: python -m compileall -q src

      - name: Run STEP01 focused tests
        run: python -m pytest -q tests/test_step01_foundation.py tests/test_step01_acceptance.py

      - name: Run recovered regression suite
        run: python -m pytest -q --disable-warnings

      - name: Capture all nine golden-viewport foundation routes
        run: |
          mkdir -p ui-golden/current ui-golden/diff ui-golden/reports
          python -m full_album_maker.foundation_capture --workspace home --output ui-golden/current/foundation-home.png --report ui-golden/reports/home.json
          python -m full_album_maker.foundation_capture --workspace media --output ui-golden/current/foundation-media.png --report ui-golden/reports/media.json
          python -m full_album_maker.foundation_capture --workspace album --output ui-golden/current/foundation-album.png --report ui-golden/reports/album.json
          python -m full_album_maker.foundation_capture --workspace timeline --output ui-golden/current/foundation-timeline.png --report ui-golden/reports/timeline.json
          python -m full_album_maker.foundation_capture --workspace visual --output ui-golden/current/foundation-visual.png --report ui-golden/reports/visual.json
          python -m full_album_maker.foundation_capture --workspace template --output ui-golden/current/foundation-template.png --report ui-golden/reports/template.json
          python -m full_album_maker.foundation_capture --workspace spectrum --output ui-golden/current/foundation-spectrum.png --report ui-golden/reports/spectrum.json
          python -m full_album_maker.foundation_capture --workspace ai_agent --output ui-golden/current/foundation-ai-agent.png --report ui-golden/reports/ai-agent.json
          python -m full_album_maker.foundation_capture --workspace render --output ui-golden/current/foundation-render.png --report ui-golden/reports/render.json

      - name: Prove deterministic repeat capture and diff pipeline
        run: |
          python -m full_album_maker.foundation_capture --workspace home --output ui-golden/current/foundation-home-repeat.png --report ui-golden/reports/home-repeat.json
          python - <<'PY'
          from pathlib import Path
          from full_album_maker.foundation_capture import _difference
          out=Path('ui-golden/diff')
          out.mkdir(parents=True, exist_ok=True)
          result=_difference(
              Path('ui-golden/current/foundation-home-repeat.png'),
              Path('ui-golden/current/foundation-home.png'),
              out,
          )
          print(result)
          assert result['normalized_absolute_difference'] == 0.0, result
          PY

      - name: Capture 1366 compact plus 125 and 150 percent DPI gates
        run: |
          python -m full_album_maker.foundation_capture --workspace media --width 1366 --height 768 --output ui-golden/current/foundation-1366.png --report ui-golden/reports/compact-1366.json
          QT_SCALE_FACTOR=1.25 python -m full_album_maker.foundation_capture --workspace home --width 1672 --height 941 --scale 1.25 --output ui-golden/current/foundation-125dpi.png --report ui-golden/reports/dpi-125.json
          QT_SCALE_FACTOR=1.5 python -m full_album_maker.foundation_capture --workspace home --width 1672 --height 941 --scale 1.5 --output ui-golden/current/foundation-150dpi.png --report ui-golden/reports/dpi-150.json

      - name: Validate shell landmark reports and screenshot evidence
        run: |
          python tests/step01_validate_evidence.py --root ui-golden
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('ui-golden/reports/home.json').read_text())['geometry']
          assert 'Noto Sans' in g['font_family'], g
          print('FONT_GATE_PASS', g['font_family'])
          PY

      - name: High-confidence secret scan
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns={
              'PRIVATE_KEY': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'GITHUB_TOKEN': re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),
              'GOOGLE_API_KEY': re.compile(r'AIza[0-9A-Za-z_-]{35}'),
              'AWS_ACCESS_KEY': re.compile(r'AKIA[0-9A-Z]{16}'),
              'OPENAI_LIKE_KEY': re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          }
          hits=[]
          for root in map(Path, ['src','tests','docs/ui-foundation','.github']):
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  try: text=p.read_text(encoding='utf-8')
                  except Exception: continue
                  for line_no,line in enumerate(text.splitlines(),1):
                      for kind,rx in patterns.items():
                          if rx.search(line): hits.append((str(p), line_no, kind))
          if hits:
              for hit in hits: print('SECRET_CANDIDATE', *hit)
              raise SystemExit(1)
          print('SECRET_SCAN_PASS')
          PY

      - name: Upload STEP01 UI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step01-ui-evidence
          path: ui-golden/
          if-no-files-found: error

  validate-windows-foundation:
    runs-on: windows-2025
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout STEP01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up target Python 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Stage pinned Noto Sans visual-QA font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets\fonts | Out-Null
          $url = "https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf"
          Invoke-WebRequest -Uri $url -OutFile assets\fonts\NotoSans.ttf
          if ((Get-Item assets\fonts\NotoSans.ttf).Length -lt 1000000) { throw "Noto Sans QA font incomplete" }

      - name: Compile and run STEP01 Windows tests
        shell: pwsh
        run: |
          python -m compileall -q src
          python -m pytest -q tests/test_step01_foundation.py tests/test_step01_acceptance.py

      - name: Capture Windows 100 125 150 percent and compact states
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ui-golden-windows | Out-Null
          $env:QT_SCALE_FACTOR='1'
          python -m full_album_maker.foundation_capture --workspace home --output ui-golden-windows/foundation-home-100.png --report ui-golden-windows/home-100.json
          python -m full_album_maker.foundation_capture --workspace media --width 1366 --height 768 --output ui-golden-windows/foundation-1366.png --report ui-golden-windows/compact-1366.json
          $env:QT_SCALE_FACTOR='1.25'
          python -m full_album_maker.foundation_capture --workspace home --scale 1.25 --output ui-golden-windows/foundation-home-125.png --report ui-golden-windows/home-125.json
          $env:QT_SCALE_FACTOR='1.5'
          python -m full_album_maker.foundation_capture --workspace home --scale 1.5 --output ui-golden-windows/foundation-home-150.png --report ui-golden-windows/home-150.json

      - name: Validate Windows reports
        shell: pwsh
        run: |
          @'
          import json
          import pathlib
          p=pathlib.Path('ui-golden-windows')
          a=json.loads((p/'home-100.json').read_text())['geometry']
          b=json.loads((p/'compact-1366.json').read_text())['geometry']
          c=json.loads((p/'home-125.json').read_text())['geometry']
          d=json.loads((p/'home-150.json').read_text())['geometry']
          assert a['window']==[1672,941]
          assert 40 <= a['title_bottom'] + 1 <= 42
          assert 92 <= a['command_bottom'] + 1 <= 100
          assert b['window']==[1366,768]
          assert b['nav_right'] + 1 <= 80
          assert c['scale']==1.25
          assert d['scale']==1.5
          assert 'Noto Sans' in a['font_family'], a
          print('WINDOWS_STEP01_GATE_PASS', a['font_family'])
          '@ | python -

      - name: Upload Windows UI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step01-ui-evidence-windows
          path: ui-golden-windows/
          if-no-files-found: error
