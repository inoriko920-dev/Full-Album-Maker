name: STEP10 Render validation

on:
  push:
    branches:
      - ui/step-10-render
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-render:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
      FAM_STEP09_PROVIDER: mock
    steps:
      - name: Checkout STEP10 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          # Keep the regression environment aligned with prior steps. Real
          # FFmpeg integration runs in the separate targeted job below.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run STEP10 focused render tests
        run: |
          python -m pytest -q \
            tests/test_step10_render_model.py \
            tests/test_step10_render_preflight.py \
            tests/test_step10_render_executor.py \
            tests/test_step10_render_queue.py \
            tests/test_step10_render_ui.py
      - name: Run STEP09 AI Agent regression gate
        run: |
          python -m pytest -q \
            tests/test_step09_slowmo_contract.py \
            tests/test_step09_agent_core.py \
            tests/test_step09_provider.py \
            tests/test_step09_async_provider.py \
            tests/test_step09_history_store.py \
            tests/test_step09_session_flow.py \
            tests/test_step09_workspace_ui.py
      - name: Run recovered render lifecycle regression
        run: |
          python -m pytest -q \
            tests/test_atomic_render_bundle.py \
            tests/test_render_lifecycle.py \
            tests/test_editor_v2_render.py \
            tests/test_renderer_integration.py \
            tests/test_safety_and_renderer.py \
            tests/test_editor_v2_s11_spectrum_free_audio.py
      - name: Run full recovered regression suite
        timeout-minutes: 7
        run: python -m pytest -q --disable-warnings

      - name: Capture deterministic STEP10 Render Center evidence
        run: |
          mkdir -p step10-render-evidence/current step10-render-evidence/reports step10-render-evidence/compare
          python -m full_album_maker.render_capture_step10 \
            --output step10-render-evidence/current/render-g09-final.png \
            --report step10-render-evidence/reports/render-g09-final.json
          python -m full_album_maker.render_capture_step10 \
            --width 1366 --height 768 \
            --output step10-render-evidence/current/render-1366-final.png \
            --report step10-render-evidence/reports/render-1366-final.json
      - name: Validate STEP10 golden state and geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def geometry(name):
              return json.loads(Path(f'step10-render-evidence/reports/{name}.json').read_text(encoding='utf-8'))['geometry']

          main = geometry('render-g09-final')
          assert main['window'] == [1672, 941], main
          assert main['workspace'] == 'render' and main['render_active'] is True, main
          assert main['inspector_active'] is True, main
          assert main['context_width'] <= 2, main
          assert main['right_dock_width'] in range(338, 359), main
          assert main['timeline_height'] in range(32, 37), main
          assert main['status_height'] in range(26, 31), main
          assert main['timeline_collapsed'] is True, main
          assert main['project_signature_unchanged_by_route_and_fixture'] is True, main
          assert main['preflight_pass_count'] == 4, main
          assert main['preflight_warn_count'] == 1, main
          cards = main['preflight_cards']
          assert cards['snapshot']['title'] == 'Timeline Valid' and cards['snapshot']['state'] == '✓ PASS', cards
          assert cards['media']['state'] == '✓ PASS', cards
          assert cards['ffmpeg']['state'] == '✓ PASS', cards
          assert cards['output']['state'] == '✓ PASS', cards
          assert cards['disk']['state'] == '⚠ WARN', cards
          assert cards['encoder']['visible'] is False, cards
          assert main['preset'] == 'youtube_1080p', main
          assert main['filename'] == 'Senja di Kota Ini - Full Album', main
          assert main['resolution'] == [1920, 1080], main
          assert main['fps'] == 30 and main['video_codec'] == 'h264', main
          assert main['video_bitrate_bps'] == 16000000, main
          assert main['audio_codec'] == 'aac' and main['sample_rate'] == 48000, main
          assert main['hardware_mode'] == 'h264_nvenc', main
          assert main['running_state'] == 'RUNNING' and abs(main['running_percent'] - 63.0) < 1e-9, main
          assert abs(main['running_fps'] - 112.0) < 1e-9, main
          assert main['queued_state'] == 'QUEUED', main
          assert main['completed_state'] == 'COMPLETED' and main['completed_verified'] is True, main
          assert main['queue_row_count'] == 3, main
          assert any('COMPLETED VERIFIED' in row for row in main['queue_rows']), main
          assert main['active_jobs_status_count'] == 2, main
          assert main['performance_points'] == 5, main
          assert main['pause_enabled'] is False, main
          assert main['add_queue_text'] == 'Tambah ke Antrian', main
          assert main['copy_log_text'] == 'Salin Log', main
          assert main['open_output_text'] == 'Buka Output', main

          compact = geometry('render-1366-final')
          assert compact['window'] == [1366, 768], compact
          assert compact['workspace'] == 'render' and compact['render_active'] is True, compact
          assert compact['inspector_active'] is True, compact
          assert compact['context_width'] <= 2, compact
          assert compact['right_dock_width'] in range(290, 311), compact
          assert compact['timeline_height'] in range(32, 37), compact
          assert compact['status_height'] in range(26, 31), compact
          assert compact['timeline_collapsed'] is True, compact
          assert compact['queue_row_count'] == 3, compact
          assert compact['preflight_pass_count'] == 4 and compact['preflight_warn_count'] == 1, compact
          assert compact['project_signature_unchanged_by_route_and_fixture'] is True, compact
          print('STEP10_RENDER_GOLDEN_GEOMETRY_PASS')
          PY
      - name: Verify immutable Render golden and build overlay when available
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image, ImageChops

          expected = '8739b225d83089772b19f05b133b98b3ea8e448d1fb905ba613751f46d988618'
          ref = Path('docs/ui-reference/09-render.png')
          current = Path('step10-render-evidence/current/render-g09-final.png')
          report = {
              'reference': '09-render.png',
              'expected_sha256': expected,
              'status': 'LOCAL_PENDING',
          }
          if ref.is_file():
              actual = hashlib.sha256(ref.read_bytes()).hexdigest()
              assert actual == expected, (actual, expected)
              golden = Image.open(ref).convert('RGB')
              rendered = Image.open(current).convert('RGB')
              assert golden.size == rendered.size == (1672, 941), (golden.size, rendered.size)
              Image.blend(golden, rendered, 0.5).save('step10-render-evidence/compare/render-overlay-50.png')
              ImageChops.difference(golden, rendered).save('step10-render-evidence/compare/render-diff.png')
              report['actual_sha256'] = actual
              report['status'] = 'PASS'
          else:
              report['detail'] = 'Exact UI-09 binary is external to this branch; exact overlay remains LOCAL_PENDING.'
          Path('step10-render-evidence/reports/golden-reference-status.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print('STEP10_GOLDEN_REFERENCE_' + report['status'])
          PY
      - name: Secret scan STEP10 Render surfaces and evidence
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),
              re.compile(r'AIza[0-9A-Za-z_-]{35}'),
              re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          ]
          roots = [Path('src/full_album_maker'), Path('tests'), Path('docs/ui-render'), Path('step10-render-evidence')]
          hits=[]
          for root in roots:
              if not root.exists():
                  continue
              paths = [root] if root.is_file() else root.rglob('*')
              for path in paths:
                  if not path.is_file() or path.suffix.lower() not in {'.py', '.md', '.json', '.txt', '.yml', '.yaml'}:
                      continue
                  text=path.read_text(encoding='utf-8', errors='ignore')
                  if any(pattern.search(text) for pattern in patterns):
                      hits.append(str(path))
          assert not hits, hits
          print('STEP10_RENDER_SECRET_SCAN_PASS')
          PY
      - name: Upload STEP10 Render evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step10-render-evidence
          path: step10-render-evidence/
          if-no-files-found: error

  real-ffmpeg-smoke:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
      FAM_STEP09_PROVIDER: mock
    steps:
      - name: Checkout STEP10 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install targeted FFmpeg runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Run isolated real FFmpeg verified-output smoke
        timeout-minutes: 3
        run: python -m pytest -q tests/test_step10_render_real_ffmpeg.py