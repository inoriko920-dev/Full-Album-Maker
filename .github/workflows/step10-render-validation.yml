name: STEP10 Render validation

on:
  push:
    branches:
      - ui/step-10-render
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-render:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
      FAM_STEP09_PROVIDER: mock
    steps:
      - name: Checkout STEP10 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          # Do not install distro FFmpeg in the baseline gate. Real STEP10
          # FFmpeg/ffprobe integration is added as an isolated targeted gate
          # after executor/output-verification is implemented.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run STEP10 focused model and preflight tests
        run: |
          python -m pytest -q \
            tests/test_step10_render_model.py \
            tests/test_step10_render_preflight.py
      - name: Run STEP09 AI Agent regression gate
        run: |
          python -m pytest -q \
            tests/test_step09_slowmo_contract.py \
            tests/test_step09_agent_core.py \
            tests/test_step09_provider.py \
            tests/test_step09_async_provider.py \
            tests/test_step09_history_store.py \
            tests/test_step09_session_flow.py \
            tests/test_step09_workspace_ui.py
      - name: Run recovered render lifecycle regression
        run: |
          python -m pytest -q \
            tests/test_atomic_bundle.py \
            tests/test_render_lifecycle.py \
            tests/test_editor_v2_s10_render.py \
            tests/test_editor_v2_s11_render_parity.py \
            tests/test_editor_v2_s11_spectrum_free_audio.py
      - name: Run full recovered regression suite
        timeout-minutes: 7
        run: python -m pytest -q --disable-warnings
