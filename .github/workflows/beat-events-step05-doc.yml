name: STEP05 Beat Event Planning Doc

on:
  push:
    branches:
      - feature/beat-animation-engine-v2
    paths:
      - "tools/generate_step05_music_event_doc.py"
      - ".github/workflows/beat-events-step05-doc.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/beat-animation-engine-v2
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"

      - name: Install document dependency
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0

      - name: Generate STEP05 DOCX and update source of truth
        run: python tools/generate_step05_music_event_doc.py

      - name: Commit planning source of truth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/beat-animation/STEP05_MUSIC_EVENT_TIMELINE_DERIVED_EVENT_ENGINE_FULL_ALBUM_MAKER_2026-10-07.docx docs/beat-animation/SOURCE_OF_TRUTH.md
          if git diff --cached --quiet; then
            echo "STEP05 planning document already current."
            exit 0
          fi
          git commit -m "docs(step05): add music event timeline source of truth"
          git push origin HEAD:feature/beat-animation-engine-v2
