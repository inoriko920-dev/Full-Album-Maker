name: Post-release UI pixel-match

on:
  push:
    branches:
      - ui/post-release-pixel-match
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-fidelity:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
      FAM_STEP09_PROVIDER: mock
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run shell and STEP10 regression
        run: |
          python -m pytest -q \
            tests/test_step10_render_model.py \
            tests/test_step10_render_preflight.py \
            tests/test_step10_render_queue.py \
            tests/test_step10_render_ui.py \
            tests/test_editor_v2_toolbar_responsive.py
      - name: Capture Render fidelity candidate
        run: |
          mkdir -p post-release-ui-evidence/current post-release-ui-evidence/reports
          python -m full_album_maker.render_capture_step10 \
            --output post-release-ui-evidence/current/render-g09-candidate.png \
            --report post-release-ui-evidence/reports/render-g09-candidate.json
      - name: Validate presentation geometry and contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('post-release-ui-evidence/reports/render-g09-candidate.json').read_text(encoding='utf-8')
          )['geometry']
          assert report['window'] == [1672, 941], report
          assert report['workspace'] == 'render' and report['render_active'] is True, report
          assert report['inspector_active'] is True, report
          assert report['context_width'] in range(286, 299), report
          assert report['right_dock_width'] in range(322, 335), report
          assert report['timeline_height'] in range(32, 37), report
          assert report['timeline_collapsed'] is True, report
          assert report['project_signature_unchanged_by_route_and_fixture'] is True, report
          assert report['running_state'] == 'RUNNING' and abs(report['running_percent'] - 63.0) < 1e-9, report
          assert report['queued_state'] == 'QUEUED', report
          assert report['completed_state'] == 'COMPLETED' and report['completed_verified'] is True, report
          assert report['queue_row_count'] == 3, report
          print('POST_RELEASE_RENDER_GEOMETRY_PASS')
          PY
      - name: Upload fidelity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post-release-ui-evidence
          path: post-release-ui-evidence/
          if-no-files-found: warn

  ai-fidelity:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
      FAM_STEP09_PROVIDER: mock
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run AI Agent regression
        run: |
          python -m pytest -q \
            tests/test_step09_slowmo_contract.py \
            tests/test_step09_agent_core.py \
            tests/test_step09_provider.py \
            tests/test_step09_async_provider.py \
            tests/test_step09_history_store.py \
            tests/test_step09_session_flow.py \
            tests/test_step09_workspace_ui.py \
            tests/test_editor_v2_s09_ai_editor.py \
            tests/test_editor_v2_v14_action_registry.py \
            tests/test_editor_v2_v14_ai_parity.py
      - name: Capture AI Agent fidelity candidate
        run: |
          mkdir -p post-release-ai-evidence/current post-release-ai-evidence/reports
          python -m full_album_maker.ai_capture_step09 \
            --output post-release-ai-evidence/current/ai-agent-g08-candidate.png \
            --report post-release-ai-evidence/reports/ai-agent-g08-candidate.json
      - name: Validate AI contracts and post-release geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('post-release-ai-evidence/reports/ai-agent-g08-candidate.json').read_text(encoding='utf-8')
          )['geometry']
          assert report['window'] == [1672, 941], report
          assert report['workspace'] == 'ai_agent' and report['ai_active'] is True, report
          assert report['conversation_visible'] is True and report['context_dock_active'] is True, report
          assert report['timeline_visible'] is True, report
          assert report['context_width'] in range(286, 299), report
          assert report['right_dock_width'] in range(322, 335), report
          assert report['status_height'] in range(26, 31), report
          assert report['state'] == 'PREVIEW_READY', report
          assert report['provider'] == 'mock', report
          assert report['scope_song_count'] == 20, report
          assert report['visual_action_count'] == 20, report
          assert report['plan_action_count'] == 22, report
          assert abs(report['slowmo_speed'] - 0.5) < 1e-9, report
          assert report['auto_arrange_present'] is True, report
          assert report['preview_command_count'] >= 22, report
          assert report['preview_change_count'] > 0, report
          assert report['project_signature_unchanged_by_send_and_preview'] is True, report
          assert report['project_revision_unchanged_by_send_and_preview'] is True, report
          assert report['send_and_preview_did_not_apply_visual'] is True, report
          assert report['send_and_preview_did_not_apply_slowmo'] is True, report
          print('POST_RELEASE_AI_CONTRACT_PASS')
          PY
      - name: Upload AI fidelity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post-release-ai-evidence
          path: post-release-ai-evidence/
          if-no-files-found: warn
