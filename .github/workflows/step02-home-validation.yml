name: STEP02 Beranda validation

on:
  push:
    branches:
      - ui/step-02-beranda
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-home:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout STEP02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Stage pinned Noto Sans visual-QA font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf" \
            --output assets/fonts/NotoSans.ttf
          test $(stat -c%s assets/fonts/NotoSans.ttf) -gt 1000000

      - name: Compile source
        run: python -m compileall -q src

      - name: Run STEP01 foundation regression
        run: python -m pytest -q tests/test_step01_foundation.py tests/test_step01_acceptance.py

      - name: Run STEP02 focused tests
        run: |
          python -m pytest -q \
            tests/test_step02_home_state.py \
            tests/test_step02_home_services.py \
            tests/test_step02_home_ui.py

      - name: Run recovered regression suite
        run: python -m pytest -q --disable-warnings

      - name: Capture STEP02 golden fixture states
        run: |
          mkdir -p step02-evidence/current step02-evidence/reports
          python -m full_album_maker.home_capture \
            --output step02-evidence/current/home-g02-a.png \
            --report step02-evidence/reports/home-g02-a.json
          python -m full_album_maker.home_capture \
            --width 1366 --height 768 \
            --output step02-evidence/current/home-1366.png \
            --report step02-evidence/reports/home-1366.json
          QT_SCALE_FACTOR=1.25 python -m full_album_maker.home_capture \
            --scale 1.25 \
            --output step02-evidence/current/home-125dpi.png \
            --report step02-evidence/reports/home-125dpi.json
          QT_SCALE_FACTOR=1.5 python -m full_album_maker.home_capture \
            --scale 1.5 \
            --output step02-evidence/current/home-150dpi.png \
            --report step02-evidence/reports/home-150dpi.json

      - name: Validate STEP02 geometry evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('step02-evidence/reports/home-g02-a.json').read_text())
          g=report['geometry']
          assert g['window'] == [1672, 941], g
          assert g['nav_right'] == 171, g
          assert g['right_dock_width'] == 348, g
          assert g['timeline_height'] == 34, g
          assert g['status_height'] == 28, g
          assert g['home_active'] is True, g
          assert g['recovery_visible'] is True, g
          assert g['recent_cards'] == 4, g
          compact=json.loads(Path('step02-evidence/reports/home-1366.json').read_text())['geometry']
          assert compact['window'] == [1366, 768], compact
          assert compact['nav_right'] == 71, compact
          assert compact['home_active'] is True, compact
          print('STEP02_HOME_GEOMETRY_PASS')
          PY

      - name: Secret scan STEP02 surfaces
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns={
              'PRIVATE_KEY': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'GITHUB_TOKEN': re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),
              'GOOGLE_API_KEY': re.compile(r'AIza[0-9A-Za-z_-]{35}'),
              'OPENAI_LIKE_KEY': re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          }
          hits=[]
          for root in map(Path, ['src/full_album_maker','tests','docs/ui-beranda']):
              if not root.exists(): continue
              for path in root.rglob('*'):
                  if not path.is_file(): continue
                  try: text=path.read_text(encoding='utf-8')
                  except Exception: continue
                  for line_no,line in enumerate(text.splitlines(),1):
                      for kind,rx in patterns.items():
                          if rx.search(line): hits.append((str(path), line_no, kind))
          if hits:
              for hit in hits: print('SECRET_CANDIDATE', *hit)
              raise SystemExit(1)
          print('SECRET_SCAN_PASS')
          PY

      - name: Upload STEP02 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step02-home-evidence
          path: step02-evidence/
          if-no-files-found: error
