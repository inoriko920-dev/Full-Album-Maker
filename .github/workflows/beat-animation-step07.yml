name: STEP07 Visual Property Binding

on:
  push:
    branches:
      - feature/beat-animation-engine-v2
    paths:
      - "src/full_album_maker/visual_binding_contract.py"
      - "src/full_album_maker/visual_binding_engine.py"
      - "tests/test_step07_visual_bindings.py"
      - ".github/workflows/beat-animation-step07.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/beat-animation-engine-v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
          python -m pip install --disable-pip-version-check -r build/requirements-audio-analysis-step04.lock
      - name: STEP07 focused tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step07_visual_bindings.py
      - name: STEP06 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step06_animation_signals.py
      - name: STEP05 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step05_music_events.py
      - name: STEP04 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step04_audio_analysis.py
      - name: Import smoke
        env:
          PYTHONPATH: src
        run: python -c "from full_album_maker.visual_binding_contract import CoreBeatPreset, VisualProperty; from full_album_maker.visual_binding_engine import core_binding_set; print(core_binding_set(CoreBeatPreset.STRONG_PUNCH).signature())"
