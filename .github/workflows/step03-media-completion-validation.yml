name: STEP03 Media completion validation

on:
  push:
    branches:
      - ui/step-03-media
      - ui/ui02-media-remediation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-completion:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run STEP03 completion tests
        run: |
          python -m pytest -q \
            tests/test_step03_media_model.py \
            tests/test_step03_media_services.py \
            tests/test_step03_media_ui.py \
            tests/test_step03_completion.py \
            tests/test_step03_preview_cache_final.py
      - name: Run recovered media regressions
        run: python -m pytest -q tests/test_async_import.py tests/test_ui_media_regressions.py
      - name: Run full regression suite
        run: python -m pytest -q --disable-warnings
      - name: Install FFmpeg for STEP03 preview smoke only
        run: sudo apt-get install -y ffmpeg
      - name: Validate video and audio preview generation
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          from full_album_maker.media_library_model import MediaAsset, MediaMetadata, MediaType, stable_asset_id
          from full_album_maker.media_preview_cache import generate_preview

          root = Path(tempfile.mkdtemp(prefix='fam-step03-preview-'))
          video = root / 'preview-source.avi'
          audio = root / 'preview-source.wav'
          subprocess.run([
              'ffmpeg','-nostdin','-y','-v','error','-f','lavfi','-i',
              'testsrc=size=160x120:rate=24:duration=1','-an','-c:v','mpeg4',str(video)
          ], check=True)
          subprocess.run([
              'ffmpeg','-nostdin','-y','-v','error','-f','lavfi','-i',
              'sine=frequency=440:sample_rate=44100:duration=1','-c:a','pcm_s16le',str(audio)
          ], check=True)
          assets = [
              MediaAsset(
                  asset_id=stable_asset_id(str(video), MediaType.VIDEO),
                  path=str(video), display_name=video.name, media_type=MediaType.VIDEO,
                  metadata=MediaMetadata(duration=1.0, width=160, height=120, fps=24.0),
              ),
              MediaAsset(
                  asset_id=stable_asset_id(str(audio), MediaType.AUDIO),
                  path=str(audio), display_name=audio.name, media_type=MediaType.AUDIO,
                  metadata=MediaMetadata(duration=1.0),
              ),
          ]
          for asset in assets:
              preview = Path(generate_preview(asset))
              assert preview.is_file() and preview.stat().st_size > 0, (asset, preview)
          print('STEP03_PREVIEW_FFMPEG_SMOKE_PASS')
          PY
      - name: Capture final Media evidence
        run: |
          mkdir -p step03-completion-evidence/current step03-completion-evidence/reports step03-completion-evidence/compare
          python -m full_album_maker.media_capture_final \
            --state golden \
            --output step03-completion-evidence/current/media-g03-final.png \
            --report step03-completion-evidence/reports/media-g03-final.json
          python -m full_album_maker.media_capture_final \
            --state empty \
            --output step03-completion-evidence/current/media-empty-final.png \
            --report step03-completion-evidence/reports/media-empty-final.json
          python -m full_album_maker.media_capture_final \
            --state golden --width 1366 --height 768 \
            --output step03-completion-evidence/current/media-1366-final.png \
            --report step03-completion-evidence/reports/media-1366-final.json
      - name: Validate final geometry and fixture collections
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from full_album_maker.media_capture_final import _golden_fixture_assets

          report=json.loads(Path('step03-completion-evidence/reports/media-g03-final.json').read_text())['geometry']
          assert report['window'] == [1672, 941], report
          assert report['media_active'] is True, report
          assert report['visible_cards'] == 24 and report['selected_count'] == 4, report
          assert report['nav_right'] in range(154, 162), report
          assert report['context_width'] in range(196, 216), report
          assert report['right_dock_width'] in range(274, 301), report
          assert report['timeline_height'] in range(180, 205), report
          assert report['status_height'] in range(26, 31), report
          counts=Counter()
          for asset in _golden_fixture_assets():
              counts.update(asset.collections)
          assert counts == {'Aset Utama':12,'B-Roll':6,'Musik':4,'Narasi':2,'Outro':1}, counts
          compact=json.loads(Path('step03-completion-evidence/reports/media-1366-final.json').read_text())['geometry']
          assert compact['window'] == [1366,768] and compact['media_active'] is True, compact
          print('STEP03_COMPLETION_GEOMETRY_PASS')
          PY
      - name: Verify golden reference and build overlay when available
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image, ImageChops

          manifest_path = Path('docs/ui-reference/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entry = next(item for item in manifest['references'] if item['id'] == 'UI-02')
          expected_sha = entry['sha256']
          ref = Path('docs/ui-reference') / entry['file']
          cur_path = Path('step03-completion-evidence/current/media-g03-final.png')
          report_path = Path('step03-completion-evidence/compare/reference-status.json')
          cur = Image.open(cur_path).convert('RGB')
          assert cur.size == tuple(manifest['golden_viewport']), (cur.size, manifest['golden_viewport'])

          status = {
              'reference_id': entry['id'],
              'reference_file': entry['file'],
              'expected_sha256': expected_sha,
              'golden_viewport': manifest['golden_viewport'],
              'current_file': str(cur_path),
              'current_sha256': hashlib.sha256(cur_path.read_bytes()).hexdigest(),
          }

          if not ref.is_file():
              status.update({
                  'status': 'LOCAL_PENDING',
                  'reason': 'Exact golden PNG is intentionally not committed; provide the immutable local golden pack to build overlay/diff.',
              })
              report_path.write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
              print('STEP03_REFERENCE_OVERLAY_LOCAL_PENDING', entry['file'], expected_sha)
          else:
              actual_sha = hashlib.sha256(ref.read_bytes()).hexdigest()
              assert actual_sha == expected_sha, (actual_sha, expected_sha)
              golden = Image.open(ref).convert('RGB')
              assert golden.size == cur.size == tuple(manifest['golden_viewport']), (golden.size, cur.size)
              Image.blend(golden, cur, 0.5).save('step03-completion-evidence/compare/media-overlay-50.png')
              ImageChops.difference(golden, cur).save('step03-completion-evidence/compare/media-diff.png')
              status.update({'status': 'PASS', 'actual_sha256': actual_sha})
              report_path.write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
              print('STEP03_REFERENCE_OVERLAY_PASS', actual_sha)
          PY
      - name: Secret scan completion surfaces
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns=[re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),re.compile(r'AIza[0-9A-Za-z_-]{35}'),re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b')]
          hits=[]
          for root in (Path('src/full_album_maker'),Path('tests')):
              for path in root.rglob('*.py'):
                  text=path.read_text(encoding='utf-8',errors='ignore')
                  if any(p.search(text) for p in patterns): hits.append(str(path))
          assert not hits, hits
          print('STEP03_COMPLETION_SECRET_SCAN_PASS')
          PY
      - name: Upload completion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step03-media-completion-evidence
          path: step03-completion-evidence
          if-no-files-found: error
