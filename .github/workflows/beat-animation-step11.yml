name: STEP11 AI Beat Actions and Natural Language

on:
  push:
    branches:
      - feature/beat-animation-engine-v2
    paths:
      - "src/full_album_maker/ai_agent_core_step09.py"
      - "src/full_album_maker/ai_action_registry_step09.py"
      - "src/full_album_maker/ai_provider_step09.py"
      - "src/full_album_maker/ai_workspace_step09.py"
      - "src/full_album_maker/ai_feature_step09.py"
      - "src/full_album_maker/ai_beat_nlu_step11.py"
      - "tests/test_step11_ai_beat_actions.py"
      - "tests/test_step11_ai_beat_nlu.py"
      - "tests/test_step11_ai_beat_provider.py"
      - ".github/workflows/beat-animation-step11.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/beat-animation-engine-v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
          python -m pip install --disable-pip-version-check -r build/requirements-audio-analysis-step04.lock
          python -m pip install --disable-pip-version-check -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: STEP11 safe Beat action tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step11_ai_beat_actions.py
      - name: STEP11 local NLU tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step11_ai_beat_nlu.py
      - name: STEP11 provider schema tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step11_ai_beat_provider.py
      - name: STEP09 Agent Core regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step09_agent_core.py
      - name: STEP10 catalog/style/BPM regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step10_advanced_catalog.py tests/test_step10_music_styles.py tests/test_step10_vinyl_bpm_sync.py
      - name: STEP09 Beat regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step09_beat_expansion.py
      - name: STEP08 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step08_beat_integration.py tests/test_step08_beat_preview.py
      - name: STEP07 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step07_visual_bindings.py
      - name: STEP06 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step06_animation_signals.py
      - name: STEP05 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step05_music_events.py
      - name: STEP04 regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_step04_audio_analysis.py
      - name: Import smoke
        env:
          PYTHONPATH: src
        run: python -c "from full_album_maker.ai_agent_core_step09 import AgentPermission; from full_album_maker.ai_action_registry_step09 import registered_action_names; from full_album_maker.ai_beat_nlu_step11 import interpret_beat_prompt; assert AgentPermission.BEAT_WRITE.value == 'beat.write'; assert 'apply_music_style' in registered_action_names(); print('STEP11_IMPORT_OK')"
