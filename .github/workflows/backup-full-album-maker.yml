name: Verified backup - Full Album Maker

on:
  push:
    branches:
      - backup/full-album-maker-2026-10-04
    paths:
      - .github/workflows/backup-full-album-maker.yml
      - .github/scripts/backup-full-album-maker.ps1

permissions:
  contents: read

jobs:
  backup:
    runs-on: windows-latest
    steps:
      - name: Checkout backup branch
        uses: actions/checkout@v4

      - name: Build and verify backup package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/backup-full-album-maker.ps1

      - name: Upload final verified backup
        uses: actions/upload-artifact@v4
        with:
          name: full-album-maker-backup-2026-10-04
          path: |
            FULL-ALBUM-MAKER-BACKUP-2026-10-04.zip
            BACKUP_RESULT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
