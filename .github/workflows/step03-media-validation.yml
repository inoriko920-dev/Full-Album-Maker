name: STEP03 Media validation

on:
  push:
    branches:
      - ui/step-03-media
      - ui/ui02-media-remediation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-media:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout STEP03 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Stage pinned Noto Sans visual-QA font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf" \
            --output assets/fonts/NotoSans.ttf
          test $(stat -c%s assets/fonts/NotoSans.ttf) -gt 1000000
      - name: Compile source
        run: python -m compileall -q src
      - name: Run STEP01 and STEP02 regressions
        run: |
          python -m pytest -q tests/test_step01_foundation.py tests/test_step01_acceptance.py
          python -m pytest -q tests/test_step02_home_state.py tests/test_step02_home_services.py tests/test_step02_home_ui.py
      - name: Run recovered media regressions
        run: python -m pytest -q tests/test_async_import.py tests/test_ui_media_regressions.py
      - name: Run STEP03 focused tests
        run: python -m pytest -q tests/test_step03_media_model.py tests/test_step03_media_services.py tests/test_step03_media_ui.py
      - name: Integration smoke shared shell
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault('QT_QPA_PLATFORM','offscreen')
          import full_album_maker.main
          from PySide6.QtWidgets import QApplication
          from full_album_maker.foundation_window import FoundationMainWindow
          app=QApplication.instance() or QApplication([])
          window=FoundationMainWindow()
          window.foundation_shell.set_workspace('media')
          app.processEvents()
          assert window.foundation_state.workspace == 'media'
          assert window.foundation_shell.workspace_stack.currentWidget() is window.media_workspace
          assert window.media_context.isHidden() is False
          assert window._inspector_router.currentWidget() is window.media_inspector
          assert window.media_timeline_canvas.isHidden() is False
          assert window._s03_timeline_old.isHidden() is True
          print('STEP03_SHARED_SHELL_SMOKE_PASS')
          PY
      - name: Run full recovered regression suite
        run: python -m pytest -q --disable-warnings
      - name: Capture STEP03 deterministic fixtures
        run: |
          mkdir -p step03-evidence/current step03-evidence/reports
          python -m full_album_maker.media_capture --state golden --output step03-evidence/current/media-g03-a.png --report step03-evidence/reports/media-g03-a.json
          python -m full_album_maker.media_capture --state empty --output step03-evidence/current/media-g03-b-empty.png --report step03-evidence/reports/media-g03-b-empty.json
          python -m full_album_maker.media_capture --state list --output step03-evidence/current/media-g03-c-list.png --report step03-evidence/reports/media-g03-c-list.json
          python -m full_album_maker.media_capture --state golden --width 1366 --height 768 --output step03-evidence/current/media-1366.png --report step03-evidence/reports/media-1366.json
          QT_SCALE_FACTOR=1.25 python -m full_album_maker.media_capture --state golden --scale 1.25 --output step03-evidence/current/media-125dpi.png --report step03-evidence/reports/media-125dpi.json
          QT_SCALE_FACTOR=1.5 python -m full_album_maker.media_capture --state golden --scale 1.5 --output step03-evidence/current/media-150dpi.png --report step03-evidence/reports/media-150dpi.json
      - name: Validate STEP03 geometry and fixture state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def g(name): return json.loads(Path(f'step03-evidence/reports/{name}.json').read_text())['geometry']
          main=g('media-g03-a')
          assert main['window'] == [1672,941], main
          assert main['workspace'] == 'media' and main['media_active'] is True, main
          assert main['visible_cards'] == 24 and main['selected_count'] == 4, main
          assert main['nav_right'] in range(150,190), main
          assert main['context_width'] >= 190, main
          assert main['right_dock_width'] >= 280, main
          assert main['timeline_height'] >= 180, main
          assert main['status_height'] in range(26,31), main
          assert g('media-g03-b-empty')['visible_cards'] == 0
          compact=g('media-1366'); assert compact['window'] == [1366,768] and compact['media_active'] is True
          print('STEP03_MEDIA_GEOMETRY_PASS')
          PY
      - name: Secret and private-fixture scan STEP03 surfaces
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns={
            'PRIVATE_KEY': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
            'GITHUB_TOKEN': re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),
            'GOOGLE_API_KEY': re.compile(r'AIza[0-9A-Za-z_-]{35}'),
            'OPENAI_LIKE_KEY': re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          }
          hits=[]
          for root in map(Path,['src/full_album_maker','tests','docs/ui-media']):
            if not root.exists(): continue
            for path in root.rglob('*'):
              if not path.is_file(): continue
              try: text=path.read_text(encoding='utf-8')
              except Exception: continue
              for line_no,line in enumerate(text.splitlines(),1):
                for kind,rx in patterns.items():
                  if rx.search(line): hits.append((str(path),line_no,kind))
          if hits:
            for hit in hits: print('SECRET_CANDIDATE',*hit)
            raise SystemExit(1)
          print('SECRET_SCAN_PASS')
          PY
      - name: Upload STEP03 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step03-media-evidence
          path: step03-evidence/
          if-no-files-found: error
