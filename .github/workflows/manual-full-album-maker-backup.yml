
name: Manual Full Album Maker verified backup

on:
  push:
    branches:
      - backup/full-album-maker-2026-10-07-0320-wib
    paths:
      - .github/workflows/manual-full-album-maker-backup.yml

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BACKUP_LABEL: "2026-10-07_03-20_WIB"
      BACKUP_REQUESTED_WIB: "2026-10-07 03:20:00 WIB"
      APP_NAME: "Full-Album-Maker"
      EXPECTED_MAIN_COMMIT: "584c94774e6197ecf60ecedb3bffd5a8797e7737"
    steps:
      - name: Create verified repository backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/BACKUP-Full-Album-Maker-$BACKUP_LABEL"
          APP="$ROOT/APP_001_FULL_ALBUM_MAKER"
          MIRROR="$RUNNER_TEMP/Full-Album-Maker.git"
          BUNDLE="$APP/GIT/Full-Album-Maker-COMPLETE-GIT-HISTORY.bundle"
          SOURCE_ZIP="$APP/SOURCE/Full-Album-Maker-SOURCE-main-$EXPECTED_MAIN_COMMIT.zip"
          FINAL_ZIP="$RUNNER_TEMP/BACKUP-Full-Album-Maker-$BACKUP_LABEL.zip"

          mkdir -p "$APP"/{GIT,SOURCE,BUILD,DOCS,RECOVERY}

          GENERATED_WIB="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')"

          echo "Cloning full mirror for complete Git history..."
          git clone --mirror "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$MIRROR"

          MAIN_COMMIT="$(git --git-dir="$MIRROR" rev-parse refs/heads/main)"
          if [ "$MAIN_COMMIT" != "$EXPECTED_MAIN_COMMIT" ]; then
            echo "Main moved after backup request. Expected $EXPECTED_MAIN_COMMIT, found $MAIN_COMMIT" >&2
            exit 1
          fi

          echo "Creating and verifying Git Bundle..."
          git --git-dir="$MIRROR" bundle create "$BUNDLE" --all
          git -C "$MIRROR" bundle verify "$BUNDLE" | tee "$APP/GIT/BUNDLE_VERIFY.txt"
          git bundle list-heads "$BUNDLE" > "$APP/GIT/BUNDLE_REFS.txt"
          test -s "$BUNDLE"

          echo "Testing restore from Git Bundle..."
          RESTORE_TEST="$RUNNER_TEMP/restore-test"
          git clone "$BUNDLE" "$RESTORE_TEST"
          git -C "$RESTORE_TEST" checkout main
          RESTORED_MAIN="$(git -C "$RESTORE_TEST" rev-parse HEAD)"
          test "$RESTORED_MAIN" = "$EXPECTED_MAIN_COMMIT"

          echo "Creating human-readable source snapshot of exact main..."
          git --git-dir="$MIRROR" archive --format=zip --output="$SOURCE_ZIP" refs/heads/main
          test -s "$SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP" >/dev/null

          echo "Copying documentation snapshot..."
          git --git-dir="$MIRROR" archive --format=tar refs/heads/main docs | tar -xf - -C "$APP/DOCS"

          echo "Recording repository metadata..."
          git --git-dir="$MIRROR" for-each-ref refs/heads --format='%(refname:short) | %(objectname)' > "$APP/BRANCHES.txt"
          git --git-dir="$MIRROR" for-each-ref refs/tags --format='%(refname:short) | %(objectname) | %(subject)' > "$APP/TAGS.txt"
          git --git-dir="$MIRROR" log --all --date=iso-strict --pretty=format:'%H | %ad | %an | %ae | %s' > "$APP/COMMIT_HISTORY.txt"
          printf '%s\n' "$EXPECTED_MAIN_COMMIT" > "$APP/MAIN_COMMIT.txt"

          REPO_VISIBILITY="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')"
          DEFAULT_BRANCH="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"

          cat > "$APP/REPOSITORY_INFO.txt" <<EOF
          APP_NAME=Full-Album-Maker
          ORIGINAL_REPO=https://github.com/$GITHUB_REPOSITORY
          DEFAULT_BRANCH=$DEFAULT_BRANCH
          VISIBILITY=$REPO_VISIBILITY
          MAIN_COMMIT=$EXPECTED_MAIN_COMMIT
          BACKUP_REQUESTED_WIB=$BACKUP_REQUESTED_WIB
          GENERATED_AT_WIB=$GENERATED_WIB
          BACKUP_WORKFLOW_RUN_ID=$GITHUB_RUN_ID
          BACKUP_BRANCH=$GITHUB_REF_NAME
          EOF

          echo "Discovering secret names without backing up secret values..."
          {
            echo "SECRET_REQUIRED_BUT_NOT_BACKED_UP"
            echo
            echo "Runtime application credentials:"
            echo "- Gemini API key/key pool, only if AI features are used: NOT BACKED UP."
            echo
            echo "GitHub Actions secret references found in tracked workflow files:"
            SECRET_NAMES="$(git --git-dir="$MIRROR" grep -h -o -E 'secrets\.[A-Za-z_][A-Za-z0-9_]*' refs/heads/main -- '.github/workflows/*' 2>/dev/null | sed 's/^secrets\.//' | sort -u || true)"
            if [ -n "$SECRET_NAMES" ]; then
              while IFS= read -r s; do
                [ -n "$s" ] && echo "- $s : SECRET_REQUIRED_BUT_NOT_BACKED_UP"
              done <<< "$SECRET_NAMES"
            else
              echo "- No explicit repository secret references detected."
            fi
            echo
            echo "GITHUB_TOKEN used by Actions is ephemeral and is not included in this backup."
          } > "$APP/REQUIRED_SECRETS.txt"

          echo "Scanning tracked source for credential-like files or high-confidence token patterns..."
          CRED_FILES="$RUNNER_TEMP/credential-files.txt"
          git --git-dir="$MIRROR" ls-tree -r --name-only refs/heads/main             | grep -Ei '(^|/)(\.env($|\.)|credentials\.json$|secrets?\.json$|id_rsa$|.*\.(pem|p12|pfx|key)$)'             > "$CRED_FILES" || true
          if [ -s "$CRED_FILES" ]; then
            echo "Credential-like tracked files detected:" >&2
            cat "$CRED_FILES" >&2
            exit 1
          fi

          TOKEN_HITS="$RUNNER_TEMP/token-hits.txt"
          git --git-dir="$MIRROR" grep -n -E             '(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,})'             refs/heads/main -- > "$TOKEN_HITS" || true
          if [ -s "$TOKEN_HITS" ]; then
            echo "Possible live token/API key pattern detected in tracked source; refusing backup." >&2
            cat "$TOKEN_HITS" >&2
            exit 1
          fi

          echo "Downloading latest tested portable release..."
          RELEASE_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          printf '%s\n' "$RELEASE_TAG" > "$APP/BUILD/RELEASE_TAG.txt"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --pattern '*Windows-Portable.zip'             --pattern 'SHA256SUMS.txt'             --dir "$APP/BUILD"

          PORTABLE_COUNT="$(find "$APP/BUILD" -maxdepth 1 -type f -name '*Windows-Portable.zip' | wc -l | tr -d ' ')"
          test "$PORTABLE_COUNT" -ge 1
          if [ -f "$APP/BUILD/SHA256SUMS.txt" ]; then
            (
              cd "$APP/BUILD"
              sha256sum -c SHA256SUMS.txt
            ) | tee "$APP/BUILD/RELEASE_CHECKSUM_VERIFY.txt"
          fi

          cat > "$APP/README_RESTORE.txt" <<'EOF'
          FULL ALBUM MAKER - CARA RESTORE SINGKAT

          Backup ini memiliki dua lapisan:
          1. GIT/*.bundle = sumber utama untuk mengembalikan riwayat Git, branch, tag, dan commit.
          2. SOURCE/*.zip = snapshot source main yang mudah dibuka manusia.

          Jika GitHub lama hilang:
          - Jalankan RECOVERY/VERIFY_BACKUP.ps1 terlebih dahulu.
          - Buat repository kosong baru di GitHub.
          - Jalankan RECOVERY/RESTORE_TO_NEW_GITHUB.ps1.
          - Masukkan URL repo baru saat diminta.
          - Script tidak akan push sebelum Anda memberikan konfirmasi.
          - Isi kembali credential/API key yang diperlukan secara manual.
          EOF

          cat > "$APP/RECOVERY/PETUNJUK_PEMULIHAN.txt" <<'EOF'
          PETUNJUK PEMULIHAN UNTUK ORANG AWAM

          KONDISI AWAL:
          GitHub lama sudah tidak bisa diakses.

          LANGKAH:
          1. Ekstrak ZIP backup utama.
          2. Buka folder APP_001_FULL_ALBUM_MAKER.
          3. Jalankan RECOVERY\VERIFY_BACKUP.ps1.
          4. Pastikan hasil verifikasi menunjukkan PASS.
          5. Buat repo kosong baru di akun GitHub baru. Jangan tambahkan README awal.
          6. Jalankan RECOVERY\RESTORE_TO_NEW_GITHUB.ps1.
          7. Masukkan URL HTTPS repo baru.
          8. Script akan clone Git Bundle dan checkout branch main.
          9. Periksa MAIN_COMMIT.txt dan pastikan commit main sesuai.
          10. Ketik Y hanya jika Anda siap mengirim branch dan tag ke GitHub baru.
          11. Isi ulang secret/API key yang tercantum di REQUIRED_SECRETS.txt.
          12. Jalankan workflow build di GitHub baru bila ingin membuat ulang build.
          13. Cocokkan checksum dengan SHA256SUMS.txt.

          FALLBACK:
          Jika Git Bundle tidak dapat dipakai, ekstrak SOURCE ZIP ke repo baru. Ini memulihkan source main,
          tetapi tidak sebaik Git Bundle karena riwayat Git lengkap tidak ikut dipulihkan dari SOURCE ZIP.
          EOF

          cat > "$APP/RECOVERY/RESTORE_TO_NEW_GITHUB.ps1" <<'POWERSHELL'
          param(
            [string]$NewRepoUrl = ""
          )

          $ErrorActionPreference = "Stop"
          $Here = Split-Path -Parent $MyInvocation.MyCommand.Path
          $App = Split-Path -Parent $Here
          $Bundle = Join-Path $App "GIT\Full-Album-Maker-COMPLETE-GIT-HISTORY.bundle"
          $MainCommit = (Get-Content (Join-Path $App "MAIN_COMMIT.txt") -Raw).Trim()
          $RestoreDir = Join-Path $Here "RESTORED_Full-Album-Maker"

          if (-not (Test-Path $Bundle)) { throw "Git Bundle tidak ditemukan: $Bundle" }

          Write-Host "Memverifikasi Git Bundle..."
          git bundle verify $Bundle
          if ($LASTEXITCODE -ne 0) { throw "Git Bundle gagal diverifikasi." }

          if (Test-Path $RestoreDir) {
            throw "Folder restore sudah ada: $RestoreDir. Hapus/pindahkan dulu agar tidak tertimpa."
          }

          git clone $Bundle $RestoreDir
          if ($LASTEXITCODE -ne 0) { throw "Clone dari Git Bundle gagal." }

          Push-Location $RestoreDir
          try {
            git checkout main
            if ($LASTEXITCODE -ne 0) { throw "Branch main tidak dapat di-checkout." }

            $Actual = (git rev-parse HEAD).Trim()
            if ($Actual -ne $MainCommit) {
              throw "MAIN_COMMIT tidak cocok. Expected=$MainCommit Actual=$Actual"
            }

            if ([string]::IsNullOrWhiteSpace($NewRepoUrl)) {
              $NewRepoUrl = Read-Host "Masukkan URL HTTPS repo GitHub BARU"
            }
            if ([string]::IsNullOrWhiteSpace($NewRepoUrl)) { throw "URL repo baru wajib diisi." }

            git remote remove origin 2>$null
            git remote add origin $NewRepoUrl

            Write-Host ""
            Write-Host "BELUM ADA DATA YANG DI-PUSH."
            Write-Host "Repo baru: $NewRepoUrl"
            Write-Host "Main commit: $Actual"
            $Confirm = Read-Host "Ketik Y untuk push SEMUA branch dan tag ke repo baru"
            if ($Confirm -notin @("Y","y")) {
              Write-Host "Dibatalkan. Tidak ada push ke GitHub."
              exit 0
            }

            git push origin --all
            if ($LASTEXITCODE -ne 0) { throw "Push branch gagal." }
            git push origin --tags
            if ($LASTEXITCODE -ne 0) { throw "Push tag gagal." }

            Write-Host "RESTORE SELESAI. Isi kembali secret/API key secara manual."
          }
          finally {
            Pop-Location
          }
          POWERSHELL

          cat > "$APP/RECOVERY/VERIFY_BACKUP.ps1" <<'POWERSHELL'
          $ErrorActionPreference = "Stop"
          $Here = Split-Path -Parent $MyInvocation.MyCommand.Path
          $App = Split-Path -Parent $Here
          $ChecksumFile = Join-Path $App "SHA256SUMS.txt"

          if (-not (Test-Path $ChecksumFile)) { throw "SHA256SUMS.txt tidak ditemukan." }

          $Failed = 0
          Get-Content $ChecksumFile | ForEach-Object {
            if ($_ -match '^([0-9a-fA-F]{64})\s+\*?(.+)$') {
              $Expected = $Matches[1].ToLower()
              $Rel = $Matches[2]
              $Path = Join-Path $App ($Rel -replace '/', '\')
              if (-not (Test-Path $Path)) {
                Write-Host "MISSING $Rel"
                $Failed++
              } else {
                $Actual = (Get-FileHash -Algorithm SHA256 $Path).Hash.ToLower()
                if ($Actual -ne $Expected) {
                  Write-Host "FAIL    $Rel"
                  $Failed++
                } else {
                  Write-Host "PASS    $Rel"
                }
              }
            }
          }

          $Bundle = Join-Path $App "GIT\Full-Album-Maker-COMPLETE-GIT-HISTORY.bundle"
          git bundle verify $Bundle
          if ($LASTEXITCODE -ne 0) { $Failed++ }

          if ($Failed -gt 0) { throw "Verifikasi gagal: $Failed masalah." }
          Write-Host "SEMUA VERIFIKASI APP PASS."
          POWERSHELL

          cat > "$ROOT/VERIFY_ALL_BACKUP.ps1" <<'POWERSHELL'
          $ErrorActionPreference = "Stop"
          $Root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $ChecksumFile = Join-Path $Root "00_SHA256SUMS.txt"
          if (-not (Test-Path $ChecksumFile)) { throw "00_SHA256SUMS.txt tidak ditemukan." }

          $Failed = 0
          Get-Content $ChecksumFile | ForEach-Object {
            if ($_ -match '^([0-9a-fA-F]{64})\s+\*?(.+)$') {
              $Expected = $Matches[1].ToLower()
              $Rel = $Matches[2]
              $Path = Join-Path $Root ($Rel -replace '/', '\')
              if (-not (Test-Path $Path)) {
                Write-Host "MISSING $Rel"
                $Failed++
              } else {
                $Actual = (Get-FileHash -Algorithm SHA256 $Path).Hash.ToLower()
                if ($Actual -ne $Expected) {
                  Write-Host "FAIL    $Rel"
                  $Failed++
                } else {
                  Write-Host "PASS    $Rel"
                }
              }
            }
          }

          if ($Failed -gt 0) { throw "Verifikasi master gagal: $Failed masalah." }
          Write-Host "SEMUA CHECKSUM MASTER PASS."
          POWERSHELL

          cat > "$ROOT/RESTORE_ALL.ps1" <<'POWERSHELL'
          $Root = Split-Path -Parent $MyInvocation.MyCommand.Path
          Write-Host "Backup ini sengaja hanya berisi SATU aplikasi:"
          Write-Host "[1] Full-Album-Maker"
          $Choice = Read-Host "Pilih nomor aplikasi"
          if ($Choice -ne "1") {
            Write-Host "Pilihan dibatalkan."
            exit 0
          }
          & (Join-Path $Root "APP_001_FULL_ALBUM_MAKER\RECOVERY\RESTORE_TO_NEW_GITHUB.ps1")
          POWERSHELL

          cat > "$APP/STATUS_BACKUP.txt" <<EOF
          APP_NAME=Full-Album-Maker
          BACKUP_STATUS=BACKUP_COMPLETE
          SOURCE_STATUS=BACKUP_COMPLETE
          GIT_HISTORY_STATUS=BACKUP_COMPLETE
          BUILD_STATUS=BACKUP_COMPLETE
          DOCUMENTATION_STATUS=BACKUP_COMPLETE
          RECOVERY_STATUS=BACKUP_COMPLETE
          SECRET_SCAN_STATUS=PASS
          MAIN_COMMIT=$EXPECTED_MAIN_COMMIT
          RELEASE_TAG=$RELEASE_TAG
          BACKUP_REQUESTED_WIB=$BACKUP_REQUESTED_WIB
          GENERATED_AT_WIB=$GENERATED_WIB
          EOF

          echo "Computing per-application checksums..."
          (
            cd "$APP"
            find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum               | sed 's#  \./#  #' > SHA256SUMS.txt
          )

          cat > "$ROOT/00_README_PERTAMA.txt" <<EOF
          BACKUP FULL ALBUM MAKER SAJA

          Sesuai instruksi pengguna, paket ini TIDAK mencakup repo/aplikasi lain.
          Backup utama aplikasi: APP_001_FULL_ALBUM_MAKER

          Backup request: $BACKUP_REQUESTED_WIB
          Dibuat: $GENERATED_WIB
          Main commit: $EXPECTED_MAIN_COMMIT
          Release: $RELEASE_TAG

          Jalankan VERIFY_ALL_BACKUP.ps1 setelah ekstrak.
          Untuk pemulihan ke GitHub baru, jalankan RESTORE_ALL.ps1.
          EOF

          cat > "$ROOT/00_BACKUP_INFO.txt" <<EOF
          SCOPE=ONLY_FULL_ALBUM_MAKER
          ORIGINAL_REPO=https://github.com/$GITHUB_REPOSITORY
          DEFAULT_BRANCH=main
          MAIN_COMMIT=$EXPECTED_MAIN_COMMIT
          RELEASE_TAG=$RELEASE_TAG
          BACKUP_REQUESTED_WIB=$BACKUP_REQUESTED_WIB
          GENERATED_AT_WIB=$GENERATED_WIB
          WORKFLOW_RUN_ID=$GITHUB_RUN_ID
          BACKUP_BRANCH=$GITHUB_REF_NAME
          SECRET_VALUES_INCLUDED=NO
          EOF

          cat > "$ROOT/00_MASTER_MANIFEST.txt" <<EOF
          TOTAL_PROYEK=1

          APP_NAME=Full-Album-Maker
          ORIGINAL_REPO=https://github.com/$GITHUB_REPOSITORY
          BACKUP_DATE_WIB=$GENERATED_WIB
          MAIN_COMMIT=$EXPECTED_MAIN_COMMIT
          GIT_BUNDLE=APP_001_FULL_ALBUM_MAKER/GIT/Full-Album-Maker-COMPLETE-GIT-HISTORY.bundle
          SOURCE_SNAPSHOT=APP_001_FULL_ALBUM_MAKER/SOURCE/Full-Album-Maker-SOURCE-main-$EXPECTED_MAIN_COMMIT.zip
          BUILD=APP_001_FULL_ALBUM_MAKER/BUILD
          DOCS=APP_001_FULL_ALBUM_MAKER/DOCS
          RECOVERY_SCRIPT=APP_001_FULL_ALBUM_MAKER/RECOVERY/RESTORE_TO_NEW_GITHUB.ps1
          BACKUP_STATUS=BACKUP_COMPLETE
          CHECKSUM_STATUS=PASS
          EOF

          cat > "$ROOT/00_MASTER_MANIFEST.csv" <<EOF
          NAMA_PROYEK,REPO,DEFAULT_BRANCH,COMMIT_TERBARU,STATUS_SOURCE,STATUS_BUILD,STATUS_DOKUMENTASI,STATUS_BACKUP,CATATAN
          Full-Album-Maker,https://github.com/$GITHUB_REPOSITORY,main,$EXPECTED_MAIN_COMMIT,BACKUP_COMPLETE,BACKUP_COMPLETE,BACKUP_COMPLETE,BACKUP_COMPLETE,Only this application was requested
          EOF

          echo "Computing master checksums..."
          (
            cd "$ROOT"
            find . -type f ! -name '00_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum               | sed 's#  \./#  #' > 00_SHA256SUMS.txt
          )

          echo "Final validation gates..."
          test -f "$ROOT/00_README_PERTAMA.txt"
          test -f "$ROOT/00_MASTER_MANIFEST.txt"
          test -f "$ROOT/00_MASTER_MANIFEST.csv"
          test -f "$ROOT/00_SHA256SUMS.txt"
          test -f "$ROOT/00_BACKUP_INFO.txt"
          test -f "$ROOT/RESTORE_ALL.ps1"
          test -f "$ROOT/VERIFY_ALL_BACKUP.ps1"
          test -s "$APP/MAIN_COMMIT.txt"
          test -s "$APP/BRANCHES.txt"
          test -s "$APP/COMMIT_HISTORY.txt"
          test -s "$BUNDLE"
          test -s "$SOURCE_ZIP"
          test -f "$APP/RECOVERY/RESTORE_TO_NEW_GITHUB.ps1"
          test -f "$APP/RECOVERY/VERIFY_BACKUP.ps1"

          (
            cd "$APP"
            sha256sum -c SHA256SUMS.txt >/dev/null
          )
          (
            cd "$ROOT"
            sha256sum -c 00_SHA256SUMS.txt >/dev/null
          )
          git -C "$MIRROR" bundle verify "$BUNDLE" >/dev/null
          unzip -t "$SOURCE_ZIP" >/dev/null

          APP_DIR_COUNT="$(find "$ROOT" -maxdepth 1 -type d -name 'APP_*' | wc -l | tr -d ' ')"
          test "$APP_DIR_COUNT" = "1"

          echo "Creating final ZIP..."
          (
            cd "$(dirname "$ROOT")"
            zip -q -r -1 "$FINAL_ZIP" "$(basename "$ROOT")"
          )
          test -s "$FINAL_ZIP"
          unzip -t "$FINAL_ZIP" >/dev/null

          FINAL_SHA="$(sha256sum "$FINAL_ZIP" | awk '{print $1}')"
          FINAL_SIZE="$(stat -c '%s' "$FINAL_ZIP")"
          printf '%s  %s\n' "$FINAL_SHA" "$(basename "$FINAL_ZIP")" > "$RUNNER_TEMP/FINAL_SHA256.txt"

          cat > "$RUNNER_TEMP/BACKUP_RESULT.txt" <<EOF
          TOTAL_PROYEK=1
          BACKUP_COMPLETE=1
          BACKUP_PARTIAL=0
          TIDAK_DAPAT_DIAKSES=0
          UKURAN_MASTER_ZIP_BYTES=$FINAL_SIZE
          SHA256_MASTER_ZIP=$FINAL_SHA
          COMMIT_TERBARU_PENTING=$EXPECTED_MAIN_COMMIT
          VALIDASI=PASS
          STATUS_AKHIR=BACKUP_COMPLETE
          BACKUP_REQUESTED_WIB=$BACKUP_REQUESTED_WIB
          GENERATED_AT_WIB=$GENERATED_WIB
          EOF

          cat "$RUNNER_TEMP/BACKUP_RESULT.txt"

      - name: Upload verified backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: BACKUP-Full-Album-Maker-2026-10-07_03-20-WIB
          path: |
            ${{ runner.temp }}/BACKUP-Full-Album-Maker-2026-10-07_03-20_WIB.zip
            ${{ runner.temp }}/FINAL_SHA256.txt
            ${{ runner.temp }}/BACKUP_RESULT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
