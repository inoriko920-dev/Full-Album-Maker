name: STEP08 Spectrum validation

on:
  push:
    branches:
      - ui/step-08-spectrum
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-spectrum:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
    steps:
      - name: Checkout STEP08 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          # Keep FFmpeg absent until after the recovered regression suite. Some
          # legacy tests intentionally key behavior from the pinned Windows tool.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Stage pinned Noto Sans visual-QA font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf" \
            --output assets/fonts/NotoSans.ttf
          test $(stat -c%s assets/fonts/NotoSans.ttf) -gt 1000000
      - name: Compile source
        run: python -m compileall -q src
      - name: Run STEP08 focused Spectrum engine tests
        run: |
          python -m pytest -q \
            tests/test_step08_spectrum_model.py \
            tests/test_step08_spectrum_render.py \
            tests/test_step08_spectrum_persistence.py
      - name: Run STEP08 workspace async and failure tests
        run: |
          python -m pytest -q \
            tests/test_step08_spectrum_ui.py \
            tests/test_step08_spectrum_preview_async.py \
            tests/test_step08_spectrum_failure.py
      - name: Run recovered Spectrum regression
        run: |
          python -m pytest -q \
            tests/test_editor_v2_s05_spectrum.py \
            tests/test_editor_v2_v12_circular_spectrum.py \
            tests/test_editor_v2_s11_spectrum_free_audio.py
      - name: Run STEP02-07 workspace regression smoke
        run: |
          python -m pytest -q \
            tests/test_step02_home_ui.py \
            tests/test_step03_media_ui.py \
            tests/test_step04_album_ui.py \
            tests/test_step05_timeline_ui.py \
            tests/test_step06_visual_ui.py \
            tests/test_step07_template_ui.py
      - name: Run STEP07 Template regression gate
        run: |
          python -m pytest -q \
            tests/test_step07_template_model.py \
            tests/test_step07_template_ui.py \
            tests/test_step07_template_thumbnail_cache.py \
            tests/test_step07_template_acceptance.py
      - name: Run full recovered regression suite
        timeout-minutes: 5
        run: python -m pytest -q --disable-warnings

      # Real audio analysis/capture comes after regression so installing Linux
      # FFmpeg cannot alter legacy tool-detection tests above.
      - name: Install FFmpeg for STEP08 real-audio evidence
        run: |
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Capture deterministic STEP08 Spectrum evidence
        run: |
          mkdir -p step08-spectrum-evidence/current step08-spectrum-evidence/reports step08-spectrum-evidence/compare step08-spectrum-evidence/probes
          python -m full_album_maker.spectrum_capture_step08 \
            --output step08-spectrum-evidence/current/spectrum-g07-final.png \
            --report step08-spectrum-evidence/reports/spectrum-g07-final.json \
            --evidence-dir step08-spectrum-evidence/probes
          python -m full_album_maker.spectrum_capture_step08 \
            --width 1366 --height 768 \
            --output step08-spectrum-evidence/current/spectrum-1366-final.png \
            --report step08-spectrum-evidence/reports/spectrum-1366-final.json \
            --evidence-dir step08-spectrum-evidence/probes
      - name: Validate STEP08 geometry audio fixture and inactivity safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def geometry(name):
              return json.loads(Path(f'step08-spectrum-evidence/reports/{name}.json').read_text(encoding='utf-8'))['geometry']

          main = geometry('spectrum-g07-final')
          assert main['window'] == [1672, 941], main
          assert main['workspace'] == 'spectrum' and main['spectrum_active'] is True, main
          assert main['context_visible'] is True and main['inspector_active'] is True, main
          assert main['timeline_visible'] is True, main
          assert main['context_width'] in range(254, 275), main
          assert main['right_dock_width'] in range(338, 359), main
          assert main['timeline_height'] in range(242, 263), main
          assert main['status_height'] in range(26, 31), main
          assert main['layer_count'] == 4 and main['spectrum_count'] == 1, main
          assert main['preset_card_count'] == 9, main
          assert main['spectrum_type'] == 'circular', main
          assert main['band_count'] == 128, main
          assert abs(main['thickness'] - 12.0) < 1e-9, main
          assert abs(main['opacity'] - 0.90) < 1e-9, main
          assert abs(main['smoothing'] - 0.65) < 1e-9, main
          assert abs(main['reactive_scale'] - 1.20) < 1e-9, main
          assert main['accent_color'] == '#1B8DFF', main
          # UI-07 golden-tuned fixture intentionally places the circular spectrum
          # left of the canvas center to balance the 10-song playlist at right.
          assert abs(main['center_x_px'] - 835.2) < 1e-6, main
          assert abs(main['center_y_px'] - 540.0) < 1e-6, main
          assert abs(main['size_ratio'] - 0.70) < 1e-6, main
          assert main['preview_status'] == 'Audio reaktif', main
          assert main['content_unchanged_by_route_and_preview'] is True, main
          probe = main['audio_probe']
          assert probe['different'] is True, probe
          assert probe['silence_sha256'] != probe['loud_sha256'], probe
          assert probe['changed_pixels_gt_2'] > 100, probe

          compact = geometry('spectrum-1366-final')
          assert compact['window'] == [1366, 768], compact
          assert compact['workspace'] == 'spectrum' and compact['spectrum_active'] is True, compact
          assert compact['context_visible'] is True and compact['inspector_active'] is True, compact
          assert compact['timeline_visible'] is True, compact
          assert compact['right_dock_width'] in range(290, 311), compact
          assert compact['preset_card_count'] == 9, compact
          assert abs(compact['center_x_px'] - 835.2) < 1e-6, compact
          assert abs(compact['center_y_px'] - 540.0) < 1e-6, compact
          assert abs(compact['size_ratio'] - 0.70) < 1e-6, compact
          assert compact['content_unchanged_by_route_and_preview'] is True, compact
          print('STEP08_SPECTRUM_GEOMETRY_AUDIO_PASS')
          PY
      - name: Verify immutable Spectrum golden and build overlay when available in repo
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image, ImageChops

          expected = 'ffd89d91c8679b819264ce012742e2387313fdfef90e2ea9a2f590685cb7d87f'
          ref = Path('docs/ui-reference/07-spectrum.png')
          current = Path('step08-spectrum-evidence/current/spectrum-g07-final.png')
          report = {
              'reference': '07-spectrum.png',
              'expected_sha256': expected,
              'status': 'LOCAL_PENDING',
          }
          if ref.is_file():
              actual = hashlib.sha256(ref.read_bytes()).hexdigest()
              assert actual == expected, (actual, expected)
              golden = Image.open(ref).convert('RGB')
              rendered = Image.open(current).convert('RGB')
              assert golden.size == rendered.size == (1672, 941), (golden.size, rendered.size)
              Image.blend(golden, rendered, 0.5).save('step08-spectrum-evidence/compare/spectrum-overlay-50.png')
              ImageChops.difference(golden, rendered).save('step08-spectrum-evidence/compare/spectrum-diff.png')
              report['actual_sha256'] = actual
              report['status'] = 'PASS'
          else:
              report['detail'] = 'Exact UI-07 binary is external to this branch; overlay/diff is completed by evidence review against the immutable master-plan embedded image.'
          Path('step08-spectrum-evidence/reports/golden-reference-status.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print('STEP08_GOLDEN_REFERENCE_' + report['status'])
          PY
      - name: Secret scan STEP08 surfaces
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),
              re.compile(r'AIza[0-9A-Za-z_-]{35}'),
              re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          ]
          hits=[]
          for root in (Path('src/full_album_maker'), Path('tests')):
              for path in root.rglob('*.py'):
                  text=path.read_text(encoding='utf-8', errors='ignore')
                  if any(pattern.search(text) for pattern in patterns):
                      hits.append(str(path))
          assert not hits, hits
          print('STEP08_SPECTRUM_SECRET_SCAN_PASS')
          PY
      - name: Upload STEP08 Spectrum evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step08-spectrum-evidence
          path: step08-spectrum-evidence/
          if-no-files-found: error