name: STEP08 Spectrum validation

on:
  push:
    branches:
      - ui/step-08-spectrum
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-spectrum:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
    steps:
      - name: Checkout STEP08 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run STEP08 focused Spectrum engine tests
        run: |
          python -m pytest -q \
            tests/test_step08_spectrum_model.py \
            tests/test_step08_spectrum_render.py
      - name: Run recovered Spectrum regression
        run: |
          python -m pytest -q \
            tests/test_editor_v2_s05_spectrum.py \
            tests/test_editor_v2_v12_circular_spectrum.py \
            tests/test_editor_v2_s11_spectrum_free_audio.py
      - name: Run STEP07 Template regression gate
        run: |
          python -m pytest -q \
            tests/test_step07_template_model.py \
            tests/test_step07_template_ui.py \
            tests/test_step07_template_thumbnail_cache.py \
            tests/test_step07_template_acceptance.py
      - name: Run full recovered regression suite
        timeout-minutes: 5
        run: python -m pytest -q --disable-warnings
