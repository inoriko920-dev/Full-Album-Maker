name: Generate Beat Planning DOCX

on:
  push:
    branches:
      - feature/beat-animation-engine-v2
    paths:
      - "docs/beat-animation/_payload/**"
      - "tools/generate_beat_planning_docs.py"
      - ".github/workflows/generate-beat-planning-docs.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/beat-animation-engine-v2
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"

      - name: Install deterministic DOCX dependency
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0

      - name: Generate source-of-truth DOCX
        run: python tools/generate_beat_planning_docs.py

      - name: Commit generated documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/beat-animation/*.docx docs/beat-animation/SOURCE_OF_TRUTH.md
          if git diff --cached --quiet; then
            echo "No generated documentation changes."
            exit 0
          fi
          git commit -m "docs(beat): generate planning source-of-truth DOCX"
          git push origin HEAD:feature/beat-animation-engine-v2
