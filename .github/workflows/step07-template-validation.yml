name: STEP07 Template validation

on:
  push:
    branches:
      - ui/step-07-template
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
    steps:
      - name: Checkout STEP07 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Stage pinned Noto Sans visual-QA font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf" \
            --output assets/fonts/NotoSans.ttf
          test $(stat -c%s assets/fonts/NotoSans.ttf) -gt 1000000
      - name: Compile source
        run: python -m compileall -q src
      - name: Run STEP07 focused Template tests
        run: |
          python -m pytest -q \
            tests/test_step07_template_model.py \
            tests/test_step07_template_ui.py \
            tests/test_step07_template_thumbnail_cache.py \
            tests/test_step07_template_acceptance.py
      - name: Run recovered template regression
        run: |
          python -m pytest -q \
            tests/test_editor_v2_s07_templates.py \
            tests/test_editor_v2_s08_custom_templates.py
      - name: Run STEP06 Visual regression gate
        run: |
          python -m pytest -q \
            tests/test_step06_visual_precision.py \
            tests/test_step06_visual_assignment.py \
            tests/test_step06_visual_preview_decode.py \
            tests/test_step06_visual_ui.py
      - name: Run full recovered regression suite
        timeout-minutes: 5
        run: python -m pytest -q --disable-warnings
      - name: Capture deterministic STEP07 Template evidence
        run: |
          mkdir -p step07-template-evidence/current step07-template-evidence/reports step07-template-evidence/compare
          python -m full_album_maker.template_capture_step07 \
            --output step07-template-evidence/current/template-g06-final.png \
            --report step07-template-evidence/reports/template-g06-final.json
          python -m full_album_maker.template_capture_step07 \
            --width 1366 --height 768 \
            --output step07-template-evidence/current/template-1366-final.png \
            --report step07-template-evidence/reports/template-1366-final.json
      - name: Validate STEP07 Template geometry and fixture contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def geometry(name):
              return json.loads(Path(f'step07-template-evidence/reports/{name}.json').read_text(encoding='utf-8'))['geometry']

          main = geometry('template-g06-final')
          assert main['window'] == [1672, 941], main
          assert main['workspace'] == 'template' and main['template_active'] is True, main
          assert main['context_visible'] is True and main['inspector_active'] is True, main
          assert main['timeline_visible'] is True, main
          assert main['context_width'] in range(254, 275), main
          assert main['right_dock_width'] in range(338, 359), main
          assert main['timeline_height'] in range(148, 169), main
          assert main['status_height'] in range(26, 31), main
          assert main['card_count'] == 10 and main['song_count'] == 4, main
          assert main['selected_template_id'] == 'spotify_clean', main
          assert main['selected_template_name'] == 'Senja di Kota Ini', main
          assert main['origin_filter'] == 'BUILT_IN', main
          assert main['category_filter'] == 'Semua', main
          assert main['ratio_filter'] == '16:9' and main['draft_ratio'] == '16:9', main
          assert main['sort_filter'] == 'Terbaru', main
          assert main['search_placeholder'] == 'Cari template...', main
          assert main['title_layout'] == 'left', main
          assert main['cover_position'] == 'full', main
          assert main['background_style'] == 'photo_dark_overlay', main
          assert main['spacing'] == 'normal', main
          assert abs(main['overlay_opacity'] - 0.60) < 1e-9, main
          assert main['scope'] == 'current', main
          assert main['built_in_save_custom_enabled'] is False, main
          assert 'belum diterapkan' in main['preview_text'], main
          assert main['thumbnail_status'] == 'FALLBACK', main
          assert main['selected_song_count'] == 2, main
          assert main['content_unchanged_by_route_and_preview'] is True, main

          compact = geometry('template-1366-final')
          assert compact['window'] == [1366, 768], compact
          assert compact['workspace'] == 'template' and compact['template_active'] is True, compact
          assert compact['context_visible'] is True and compact['inspector_active'] is True, compact
          assert compact['timeline_visible'] is True, compact
          assert compact['card_count'] == 10 and compact['song_count'] == 4, compact
          assert compact['context_width'] in range(254, 275), compact
          assert compact['right_dock_width'] in range(290, 311), compact
          assert compact['timeline_height'] in range(148, 169), compact
          assert compact['content_unchanged_by_route_and_preview'] is True, compact
          print('STEP07_TEMPLATE_GEOMETRY_PASS')
          PY
      - name: Verify immutable Template golden and build overlay when available
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image, ImageChops

          expected = 'cd2dcd55dcfcf16b947737e459129178a71f76b52b625e398c0fc2f1e87f5895'
          ref = Path('docs/ui-reference/06-template.png')
          current = Path('step07-template-evidence/current/template-g06-final.png')
          report = {
              'reference': '06-template.png',
              'expected_sha256': expected,
              'status': 'LOCAL_PENDING',
          }
          if ref.is_file():
              actual = hashlib.sha256(ref.read_bytes()).hexdigest()
              assert actual == expected, (actual, expected)
              golden = Image.open(ref).convert('RGB')
              rendered = Image.open(current).convert('RGB')
              assert golden.size == rendered.size == (1672, 941), (golden.size, rendered.size)
              Image.blend(golden, rendered, 0.5).save('step07-template-evidence/compare/template-overlay-50.png')
              ImageChops.difference(golden, rendered).save('step07-template-evidence/compare/template-diff.png')
              report['actual_sha256'] = actual
              report['status'] = 'PASS'
          else:
              report['detail'] = 'Exact UI-06 binary is not stored in this branch; provide the immutable local golden pack for exact overlay/diff.'
          Path('step07-template-evidence/reports/golden-reference-status.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print('STEP07_GOLDEN_REFERENCE_' + report['status'])
          PY
      - name: Secret scan STEP07 surfaces
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'gh[pousr]_[A-Za-z0-9]{36,255}'),
              re.compile(r'AIza[0-9A-Za-z_-]{35}'),
              re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          ]
          hits=[]
          for root in (Path('src/full_album_maker'), Path('tests')):
              for path in root.rglob('*.py'):
                  text=path.read_text(encoding='utf-8', errors='ignore')
                  if any(pattern.search(text) for pattern in patterns):
                      hits.append(str(path))
          assert not hits, hits
          print('STEP07_TEMPLATE_SECRET_SCAN_PASS')
          PY
      - name: Upload STEP07 Template evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step07-template-evidence
          path: step07-template-evidence/
          if-no-files-found: error
