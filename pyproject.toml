[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "full-album-video-maker"
version = "1.6.1"
description = "Portable Windows full-album video maker with FFmpeg and Gemini Agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6==6.11.2",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "librosa==1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
